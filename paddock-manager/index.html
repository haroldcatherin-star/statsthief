<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Paddock Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap">
<style>
/* Habillage de retransmission : fond carbone, bandeaux noirs, liseré aux couleurs de l'écurie, tour de classement. Thème sombre unique. */
:root{
  --bg:#0E0E13; --panel:#16161D; --panel2:#1D1D26; --line:#2A2A36; --fg:#F2F2F6; --dim:#9C9CAD; --faint:#6A6A7A;
  --purple:#B04DFF; --green:#22C55E; --yellow:#F5C400; --red:#EF3B3B; --blue:#3B82F6;
  --club-a:#1E3F8F; --club-b:#F2B807; --club-a-ink:#fff;
  --f:'Titillium Web',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.4;
  background-image:linear-gradient(45deg,rgba(255,255,255,.018) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.018) 75%),linear-gradient(45deg,rgba(255,255,255,.018) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.018) 75%);background-size:8px 8px;background-position:0 0,4px 4px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--club-b);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:.01em;text-wrap:balance}
h1{font-size:2rem;line-height:1;text-transform:uppercase;font-style:italic}
h2{font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em}
.num{font-variant-numeric:tabular-nums}
.note{color:var(--dim);font-size:.85rem}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
.side{background:#09090D;border-right:1px solid var(--line);padding-block:16px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.side .team{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side .team b{font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.05}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.82rem;padding:10px 10px;border-left:3px solid transparent;text-align:left;width:100%}
.nav:hover{color:var(--fg);background:var(--panel)}
.nav[aria-current="true"]{color:var(--fg);border-left-color:var(--club-a);background:linear-gradient(90deg,color-mix(in srgb,var(--club-a) 22%,transparent),transparent)}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:3px;padding:0 6px;font-size:.72rem}
.main{min-width:0;padding-block:0 60px}
.top{display:flex;align-items:stretch;gap:0;background:#09090D;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10;flex-wrap:wrap}
.top .cell{padding:10px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.top .cell span{font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.top .cell b{font-size:1.05rem;font-weight:900}
.top .go{margin-left:auto;border:0;background:var(--club-a);color:var(--club-a-ink);font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:0 22px;font-style:italic;clip-path:polygon(14px 0,100% 0,100% 100%,0 100%)}
.top .go:hover{filter:brightness(1.15)}
.content{padding-block:20px;padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px))}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line)}
  .side .team{display:none}.nav{white-space:nowrap;width:auto;border-left:0;border-bottom:3px solid transparent;padding:8px 10px}.nav[aria-current="true"]{border-bottom-color:var(--club-a)}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .cell{padding:8px 12px}.top .go{width:100%;padding:12px;clip-path:none}
}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px;border-left:6px solid var(--club-a);padding-left:12px}
.vhead .sub{color:var(--dim);margin:4px 0 0}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.cols3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
@media (max-width:560px){.cols3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.panel.acc{border-top:3px solid var(--club-a)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--panel2);padding:8px 14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:.8rem;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn.primary{background:var(--club-a);border-color:var(--club-a);color:var(--club-a-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.15)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:.72rem}
.btn.big{padding:12px 22px;font-size:.95rem;font-style:italic}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.on{border-color:var(--club-b);color:var(--club-b)}
select,input[type=text],input:not([type]),textarea{background:var(--panel2);border:1px solid var(--line);padding:7px 10px;min-width:0}
.field-full{width:100%}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.pill.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.pill.warn{color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 40%,transparent)}
.pill.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.pill.pu{color:var(--purple);border-color:color-mix(in srgb,var(--purple) 45%,transparent)}
.pill.tr{color:#D8D8E8}
.flag{display:inline-block;width:18px;height:12px;vertical-align:-1px;margin-right:6px;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.crest{display:inline-grid;place-items:center;background:var(--club-a);color:var(--club-a-ink);font-weight:900;font-style:italic;border-bottom:4px solid var(--club-b);flex:none;clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%)}
.alert{border:1px solid color-mix(in srgb,var(--yellow) 45%,var(--line));background:color-mix(in srgb,var(--yellow) 7%,var(--panel));padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.alert.urgent{border-color:color-mix(in srgb,var(--red) 55%,var(--line));background:color-mix(in srgb,var(--red) 8%,var(--panel))}
.alert h2{font-size:.95rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);text-align:left;padding:8px;background:#101016;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.me td{background:color-mix(in srgb,var(--club-a) 18%,transparent)}
tr.promo td:first-child{box-shadow:inset 3px 0 var(--green)}
th.r,td.r{text-align:right}
.th-sort{border:0;background:none;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;padding:0;display:inline-flex;gap:4px}
.th-sort.on{color:var(--fg)}
.attrs{display:flex;flex-direction:column;gap:5px}
.attr{display:grid;grid-template-columns:120px 1fr 32px;gap:8px;align-items:center;font-size:.82rem}
.track{height:6px;background:var(--panel2);position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--club-a)}
.track b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
.attr .v{text-align:right;font-weight:700}
.news{display:flex;flex-direction:column;max-height:360px;overflow:auto}
.news div{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.news .wk{color:var(--faint);font-size:.75rem;min-width:84px;font-weight:700}
.ticket{display:flex;flex-direction:column;gap:3px;font-size:.85rem}
.ticket div{display:flex;justify-content:space-between;gap:10px}
.ticket div span:first-child{color:var(--dim)}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);background:var(--panel2)}
.rung .lv{font-weight:900;font-style:italic;color:var(--dim)}
.rung.now{border-color:var(--club-a);background:color-mix(in srgb,var(--club-a) 18%,var(--panel2))}
.rung.done{opacity:.6}
.ovr{display:inline-block;min-width:32px;text-align:center;font-weight:900;padding:1px 6px;background:var(--panel2);border:1px solid var(--line)}
.ovr.hi{color:var(--green)}.ovr.mid{color:var(--yellow)}.ovr.lo{color:var(--dim)}
.gauge{height:8px;background:var(--panel2);position:relative;border:1px solid var(--line)}
.gauge i{position:absolute;inset:0 auto 0 0}

/* Tour de classement */
.tower{background:#07070A;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.tw-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#000;border-bottom:2px solid var(--club-a);font-weight:900;text-transform:uppercase;font-style:italic}
.tw-row{display:grid;grid-template-columns:28px 5px 52px minmax(0,1fr) 22px 66px 30px;gap:6px;align-items:center;padding:4px 8px;border-bottom:1px solid #15151c;font-size:.86rem}
.tw-row .p{font-weight:900;text-align:center;background:#fff;color:#000;font-size:.78rem;padding:1px 0}
.tw-row .bar{height:16px}
.tw-row .c{font-weight:900;letter-spacing:.04em}
.tw-row .n{color:var(--dim);font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw-row .g{text-align:right;font-weight:700}
.tw-row .st{color:var(--faint);font-size:.72rem;text-align:right}
.tw-row.me{background:color-mix(in srgb,var(--club-a) 25%,#07070A)}
.tw-row.dnf{opacity:.45}
.tw-row.pit .g{color:var(--yellow)}
.tyre{width:20px;height:20px;border-radius:50%;border:3px solid;display:inline-grid;vertical-align:middle;flex:none;place-items:center;font-size:.6rem;font-weight:900;background:#111}
.live-grid{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.live-grid{grid-template-columns:1fr}}
.lapbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#000;border:1px solid var(--line);padding:10px 14px}
.lapbar .lap{font-size:1.6rem;font-weight:900;font-style:italic}
.flagbox{padding:2px 10px;font-weight:900;text-transform:uppercase;font-size:.8rem}
.flagbox.green{background:var(--green);color:#000}.flagbox.sc{background:var(--yellow);color:#000}.flagbox.fin{background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/12px 12px;color:transparent;min-width:40px}
.radio{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.radio div{display:grid;grid-template-columns:34px 1fr;gap:8px;font-size:.88rem;padding:5px 8px;background:var(--panel2);border-left:3px solid var(--faint)}
.radio .l{color:var(--faint);font-weight:700;font-size:.75rem}
.radio .bad{border-left-color:var(--red)}.radio .good{border-left-color:var(--green)}.radio .warn{border-left-color:var(--yellow)}.radio .sc{border-left-color:var(--yellow)}.radio .wx{border-left-color:var(--blue)}.radio .pit{border-left-color:var(--club-b)}
.ctl{border:1px solid var(--line);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px}
.ctl .hd{display:flex;align-items:center;gap:8px;justify-content:space-between}
.wear{height:8px;background:var(--panel2);position:relative}
.wear i{position:absolute;inset:0 auto 0 0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line)}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel2);padding:6px 10px;font-weight:700;font-size:.75rem;text-transform:uppercase}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--club-a);color:var(--club-a-ink)}
.tyrebtn{border:1px solid var(--line);background:var(--panel2);padding:4px 8px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.75rem}
.tyrebtn.on{border-color:var(--club-b);box-shadow:0 0 0 1px var(--club-b) inset}

/* Arbre */
.tree{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.tree{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.tree{grid-template-columns:1fr}}
.branch{display:flex;flex-direction:column;gap:8px}
.branch h2{padding:8px 10px;background:#000;border-left:4px solid var(--club-a)}
.node{border:1px solid var(--line);background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:5px;position:relative}
.node.lock{opacity:.5}
.node.max{border-color:color-mix(in srgb,var(--green) 50%,var(--line))}
.node.run{border-color:var(--club-b)}
.node b{font-size:.92rem}
.lvl{display:flex;gap:3px}
.lvl i{width:16px;height:6px;background:var(--panel2);border:1px solid var(--line)}
.lvl i.on{background:var(--green);border-color:var(--green)}
.node .meta{font-size:.75rem;color:var(--dim)}
.node .prog{height:5px;background:var(--panel2)}
.node .prog i{display:block;height:100%;background:var(--club-b)}

/* Modale */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow:auto;z-index:40}
#modal{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--club-a);width:min(760px,100%);padding:20px;display:flex;flex-direction:column;gap:12px}
.big-title{font-size:1.8rem;font-weight:900;font-style:italic;text-transform:uppercase;margin:0;line-height:1}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:28px;height:28px;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.sw-custom{width:36px;height:30px;border:1px solid var(--line);background:none;padding:0}
.preview{display:flex;gap:14px;align-items:center;padding:12px;background:#000;border-left:6px solid var(--club-a)}
.preview .bar{height:6px;background:linear-gradient(90deg,var(--club-a) 60%,var(--club-b) 60%)}
#toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;max-width:calc(100% - 32px)}
.toast{background:#000;border:1px solid var(--line);border-left:4px solid var(--green);padding:10px 14px;font-weight:700}
.toast.bad{border-left-color:var(--red)}
textarea.code{width:100%;height:90px;font-family:monospace;font-size:.75rem}
.offer{border:1px solid var(--line);background:var(--panel2);padding:12px;display:flex;flex-direction:column;gap:6px}
.offer.sel{border-color:var(--green)}
.offer .terms{display:flex;flex-direction:column;font-size:.85rem;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="shell">
  <nav class="side" id="nav" aria-label="Menu">
    <div class="team"><span id="side-crest"></span><b id="side-team"></b></div>
    <button class="nav" data-v="qg">QG</button>
    <button class="nav" data-v="course">Course <span id="nb-race"></span></button>
    <button class="nav" data-v="ecurie">Écurie <span id="nb-ec"></span></button>
    <button class="nav" data-v="dev">Développement</button>
    <button class="nav" data-v="pilotes">Pilotes <span id="nb-pil"></span></button>
    <button class="nav" data-v="championnat">Championnat</button>
    <button class="nav" data-v="business">Business <span id="nb-biz"></span></button>
    <button class="nav" data-v="histoire">Histoire</button>
    <button class="nav" data-v="saves">Sauvegardes</button>
  </nav>
  <div class="main">
    <div class="top"><div class="cell"><span>Championnat</span><b id="t-ser"></b></div><div class="cell"><span>Saison</span><b id="t-season"></b></div><div class="cell"><span>Manche</span><b id="t-race"></b></div><div class="cell"><span>Trésorerie</span><b id="t-cash" class="num"></b></div><button class="go" id="play"></button></div>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="overlay" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>

function weekend(){
  if(s.wk&&s.wk.race===s.race&&s.wk.season===s.season)return s.wk;
  const key=s.cal[s.race],trk=TRACKS[key],w=new Array(LAPS+1).fill(0);
  if(Math.random()<trk.rain){const st=Math.random()<.4?0:ri(4,14),len=ri(4,12),it=Math.random()<.35?2:1;for(let l=st;l<=Math.min(LAPS,st+len);l++)w[l]=it;
    if(it===2&&st+2<=LAPS){w[st]=1;}}
  const st=s.staff.strat.r,err=Math.round((100-st)/25);
  let fc;const firstRain=w.findIndex(x=>x>0);

  // voiture

    if(promote){s.car={aero:68,chassis:68,rel:72};s.carG=null;s.tree={};s.dev=[];s.gpSeasons=0;}
    else{s.gpSeasons++;const reg=s.gpSeasons%4===0;
      if(reg){const keep={own:G().own,eng:G().eng};s.carG={aero:0,chassis:0,rel:0,slow:0,fast:0,tyre:0,pit:G().pit,eng:keep.eng,own:keep.own};
        Object.keys(s.tree).forEach(id=>{if(TREEN[id].br!=='pu'&&id!=='pit')delete s.tree[id];});
        s.car={aero:70+(s.staff.td.r-60)/5,chassis:70+(s.staff.td.r-60)/5,rel:75};s.ai.forEach(t=>{const b=t.budget;t.car={aero:68+b*9+rnd(-4,4),chassis:68+b*9+rnd(-4,4),rel:clamp(72+b*12+rnd(-5,5),60,95)};});
        news('Nouveau règlement technique : l\'arbre de développement repart de zéro pour tout le monde (sauf le moteur) !');}
      else s.ai.forEach(t=>{t.car.aero=t.car.aero*.9+70*.1+t.budget*2;t.car.chassis=t.car.chassis*.9+70*.1+t.budget*2;});
      if((s.gpSeasons+1)%4===0)news('Annonce : un nouveau règlement entrera en vigueur dans un an.');}
    s.rdSpent=0;
    s.dev.forEach(p=>{if(p.id==='own'&&p.due){s.cash-=p.due;s.rdSpent+=p.due;led('Programme moteur maison (2e année)',-p.due);p.due=0;}});
  }
  if(promote){buildGrid();}
  else{s.ai.forEach(t=>t.drivers.forEach(d=>{d.age++;if(d.age>=37||Math.random()<.18){const nd=genDriver({ser:s.ser,age:ri(19,24),lvl:SER[s.ser].lvl+(t.ops-65)/4+rnd(-3,6)});Object.assign(d,nd);}}));}
  s.season++;s.year++;s.race=0;s.results=[];s.dStand={};s.tStand={};s.end=null;s.lastRace=null;s.wk=null;s.live=null;s.alerts=[];
  genCal();genMarket();if(!s.sponsor)genOffers();genStaffPool();genJuniors();genJr();
  if(s.drivers.length<2)news('Il te manque '+(2-s.drivers.length)+' pilote'+(s.drivers.length?'':'s')+' titulaire'+(s.drivers.length?'':'s')+' : recrute sur le marché (onglet Pilotes).');
  news('Saison '+s.season+' ('+s.year+') en '+SER[s.ser].long+'. Calendrier : '+s.cal.length+' courses, tirées au sort.');
  save();ui.view='qg';
}
function hofCheck(d){if(d.st.wins>=5||d.st.titles>=1){s.hof.push({name:nm(d),nat:d.nat,starts:d.st.starts,wins:d.st.wins,pod:d.st.pod,poles:d.st.poles,pts:d.st.pts,titles:d.st.titles,y:s.year});news(nm(d)+' entre au Hall of Fame de l\'écurie.');}}

// ================= Sauvegarde =================
function save(){if(!s)return;try{localStorage.setItem(KEY,JSON.stringify({s,uid}))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);s=o.s;uid=Math.max(uid,o.uid||0)+1;s.me={name:s.team};return true}}catch(e){}return false}
const slotKey=i=>KEY+'-slot'+i;
function readSlot(i){try{const r=localStorage.getItem(slotKey(i));return r?JSON.parse(r):null}catch(e){return null}}
const summary=st=>st.team+' · '+SER[st.ser].n+' · saison '+st.season+' ('+st.year+') · GP '+Math.min(st.race+1,SER[st.ser].races);
const exportText=()=>JSON.stringify({app:'paddock-manager',version:2,exportedAt:new Date().toISOString(),state:s,uid});
function parseSave(t){let o;try{o=JSON.parse(t)}catch(e){throw new Error('Ce texte n\'est pas une sauvegarde valide (JSON illisible).')}const st=o&&o.state?o.state:o;if(!st||!st.team||!st.ser||!Array.isArray(st.drivers))throw new Error('Ce fichier ne ressemble pas à une sauvegarde de Paddock Manager.');if(st.v!==2)throw new Error('Cette sauvegarde vient de l\'ancienne version du jeu et n\'est plus compatible.');return {st,uid:o.uid||0};}
// ================= Couleurs =================
function lum(hex){const n=parseInt(String(hex).slice(1),16);return [n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((t,v,i)=>t+v*[.2126,.7152,.0722][i],0);}
const inkFor=h=>lum(h)>0.2?'#14110E':'#FFFFFF';
function applyColors(){const c=s.colors,r=document.documentElement.style;r.setProperty('--club-a',lum(c.a)<.02?'#3A3A48':c.a);r.setProperty('--club-b',c.b);r.setProperty('--club-a-ink',inkFor(lum(c.a)<.02?'#3A3A48':c.a));}
function crest(size,txt,c){const st=c?`--club-a:${c.a};--club-b:${c.b};--club-a-ink:${inkFor(c.a)};`:'';txt=txt??s.short;return `<span class="crest" style="${st}width:${size}px;height:${size}px;font-size:${Math.round(size*(txt.length>3?.28:.36))}px" aria-hidden="true">${esc(txt)}</span>`;}
const tyreIc=(c,sz=20)=>`<span class="tyre" style="border-color:${TYRES[c].col};width:${sz}px;height:${sz}px" title="${TYRES[c].n}">${c}</span>`;
const traitPills=d=>(d.tr||[]).map(t=>`<span class="pill tr" title="${esc(TRAITS[t].d)}">${TRAITS[t].n}</span>`).join(' ');
const trkProfile=trk=>['Lent et sinueux','Polyvalent','Rapide'][trk.type];

// ================= Tri =================
const GET={nm:d=>(d.ln+' '+d.fn).toLowerCase(),age:d=>d.age,ovr:d=>dOvr(d),pace:d=>d.a.pace,wet:d=>d.a.wet,mkt:d=>d.mkt,ask:d=>askFor(d,s.ser),nat:d=>d.nat,pot:d=>(d.potLo+d.potHi)/2};
const DESC=new Set(['ovr','pace','wet','mkt','pot']);
function th(tbl,k,label,right){const st=ui.sort[tbl],on=st&&st.k===k;return `<th class="${right?'r':''}"><button class="th-sort${on?' on':''}" data-tbl="${tbl}" data-sort="${k}">${label}<i>${on?(st.dir==='asc'?'▲':'▼'):''}</i></button></th>`;}
function sorted(list,tbl,fb){const st=ui.sort[tbl];if(!st)return list.sort(fb);const g=GET[st.k],m=st.dir==='asc'?1:-1;return list.sort((a,b)=>{const x=g(a),y=g(b);return (x<y?-1:x>y?1:0)*m||fb(a,b);});}

// ================= Rendu =================
function render(){
  if(!s)return;applyColors();const S=SER[s.ser];
  $('side-crest').innerHTML=crest(40);$('side-team').textContent=s.team;
  $('t-cash').textContent=meur(s.cash);$('t-cash').style.color=s.cash<0?'var(--red)':'';
  $('t-ser').textContent=S.n;$('t-season').textContent=s.year+' · S'+s.season;
  $('t-race').textContent=done()?'Terminée':(s.race+1)+' / '+S.races;
  const L=s.live;
  $('play').textContent=done()?'Bilan de saison ›':L&&!L.done?'Retour en course ›':'GP '+curTrack().n+' ›';
  $('nb-biz').innerHTML=s.sponsor?'':'<span class="badge">!</span>';
  $('nb-pil').innerHTML=s.drivers.length<2?'<span class="badge">!</span>':'';
  $('nb-ec').innerHTML=s.alerts.length?`<span class="badge">${s.alerts.length}</span>`:'';
  $('nb-race').innerHTML=L&&!L.done?'<span class="badge">LIVE</span>':'';
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===ui.view));
  ({qg:vQG,course:vRace,ecurie:vTeam,dev:vDev,pilotes:vDrivers,championnat:vStand,business:vBiz,histoire:vHist,saves:vSaves})[ui.view]();
}
function standMini(){const tt=teamTable().slice(0,10);return `<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Équipe</th><th class="r">Pts</th></tr></thead><tbody>${tt.map((x,i)=>`<tr class="${x.me?'me':''} ${i<3&&SER[s.ser].next?'promo':''}"><td class="num">${i+1}</td><td>${esc(x.n)}</td><td class="r num">${x.p}</td></tr>`).join('')}</tbody></table></div>`;}
function alertsHtml(){
  return s.alerts.map(a=>{
    if(a.kind==='contracts')return `<div class="alert urgent"><h2>${esc(a.t)}</h2><p style="margin:0">${esc(a.x)}</p><div class="stack" style="gap:6px">${a.items.map(it=>{
      if(it.k==='d'){const d=s.drivers.find(x=>x.id===it.id);if(!d||d.contract.yrs>1)return '';const ask=askFor(d,s.ser)*(d.courted?1.15:1);return `<div class="inline sp"><span>${flag(d.nat)}<b>${esc(nm(d))}</b> · pilote${d.courted?` · <span class="pill warn">Courtisé par ${esc(d.courted)}</span>`:''}</span><button class="btn sm primary" data-act="renew-d" data-id="${d.id}">Prolonger 2 saisons · ${ask>=0?meur(ask)+'/an':'apport '+meur(-ask)}</button></div>`;}
      if(it.k==='s'){const m=s.staff[it.role];if(m.yrs>1)return '';return `<div class="inline sp"><span><b>${esc(m.name)}</b> · ${ROLES[it.role].toLowerCase()} (${m.r})</span><button class="btn sm primary" data-act="renew-s" data-k="${it.role}">Prolonger 3 saisons · ${meur(staffSal(m.r,s.ser)*1.05)}/an</button></div>`;}
      if(it.k==='sp'&&s.sponsor&&s.sponsor.yrs<=1)return `<div class="inline sp"><span><b>${esc(s.sponsor.name)}</b> · sponsor titre</span><button class="btn sm primary" data-act="renew-sp">Prolonger 2 saisons aux mêmes conditions</button></div>`;
      return '';}).join('')||'<span class="note">Tout est réglé.</span>'}</div><button class="btn sm" data-act="dismiss" data-k="${a.k}" style="align-self:flex-start">Fermer l'alerte</button></div>`;
    if(a.kind==='n1'){const d=s.drivers.find(x=>x.id===a.id);if(!d)return '';const o=s.drivers.find(x=>x.id!==a.id);return `<div class="alert"><h2>${esc(a.t)}</h2><p style="margin:0">${esc(a.x)} ${o?'Si tu acceptes, '+esc(nm(o))+' le vivra mal.':''}</p><div class="inline"><button class="btn sm primary" data-act="n1-yes" data-id="${d.id}" data-k="${a.k}">Lui donner le statut de n°1</button><button class="btn sm" data-act="n1-no" data-id="${d.id}" data-k="${a.k}">Refuser : égalité</button></div></div>`;}
    if(a.kind==='poach'){const j=s.academy.find(x=>x.id===a.id);if(!j)return '';const fee=j.place==='f3'?150e3:400e3;return `<div class="alert"><h2>${esc(a.t)}</h2><p style="margin:0">${esc(a.x)}</p><div class="inline"><button class="btn sm primary" data-act="lock-j" data-id="${j.id}" data-k="${a.k}" ${s.cash<fee?'disabled':''}>Le garder · ${meur(fee)}</button><button class="btn sm" data-act="dismiss" data-k="${a.k}">Le laisser partir</button></div></div>`;}
    return '';}).join('');
}

function carBars(){const e=engineOf(s.me);const rows=[['Aérodynamique',s.car.aero+G().aero,'aero'],['Châssis',s.car.chassis+G().chassis,'chassis'],['Moteur',e,'e'],['Fiabilité',relOf(s.me),'rel']];
  const best=k=>Math.max(...s.ai.map(t=>k==='e'?engineOf(t):t.car[k]));

function towerHtml(L){

let pendingImport=null,dl=null,draft=null,timer=null;
(function initDl(n){if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{dl=d;if(s&&ui.view==='saves')render();}).catch(()=>{});}else if(n<20)setTimeout(()=>initDl(n+1),250);})(0);

function armed(b,label){if(b.dataset.armed){delete b.dataset.armed;return true;}const old=b.textContent;b.dataset.armed='1';b.textContent=label;setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=old;}},4000);return false;}

function setupModal(first){

    <div class="inline" style="align-items:flex-start"><div style="flex:1;min-width:180px"><label for="o-name"><b>Nom de l'écurie</b></label><input class="field-full" id="o-name" maxlength="32" value="${esc(draft.name)}"></div><div style="width:110px"><label for="o-short"><b>Sigle</b></label><input class="field-full" id="o-short" maxlength="4" value="${esc(draft.short)}"></div></div>

    <button class="btn primary big" data-act="setup-save">${draft.first?'Créer l\'écurie':'Enregistrer'}</button>`);

function readSetup(){if(draft&&$('o-name')){draft.name=$('o-name').value;draft.short=$('o-short').value;}}
function readPlan(){if($('pl-setup'))s.plan.setup=Number($('pl-setup').value);}
function signDriver(d,yrs){d.contract={yrs,sal:askFor(d,s.ser)};s.drivers.push(d);if(d.contract.sal<0)news(nm(d)+' rejoint l\'écurie et apporte '+meur(-d.contract.sal)+' par saison.');else news(nm(d)+' signe pour '+yrs+' saison'+(yrs>1?'s':'')+'.');}
function refreshStaffPool(){if(s.race===6||s.race===12)genStaffPool();}

// ================= Course en direct : chrono =================
function setSpeed(v){ui.speed=v;if(timer){clearInterval(timer);timer=null;}if(v>0&&s.live&&!s.live.done){timer=setInterval(()=>{if(!s.live||s.live.done){clearInterval(timer);timer=null;return;}lapStep();afterLap();},Math.round(4500/v));}}
function afterLap(){if(s.live.done){setSpeed(0);refreshStaffPool();}save();if(ui.view==='course')render();else{$('nb-race').innerHTML=s.live.done?'':'<span class="badge">LIVE</span>';}}
function playBtn(){
  if(s.over)return showEnd();
  if(s.live&&s.live.done){s.live=null;}
  if(done()){ui.view='qg';render();return s.end?showEnd():(endSeason(),showEnd());}
  if(ui.view!=='course'){ui.view='course';return render();}
  const wk=weekend();
  if(s.live)return;
  if(!s.sponsor){toast('Choisis d\'abord un sponsor titre (onglet Business).',true);ui.view='business';return render();}
  if(s.drivers.length<2){toast('Il te faut deux pilotes titulaires.',true);ui.view='pilotes';return render();}
  readPlan();
  if(wk.stage==='prep'){runQuali();return render();}
  startRace();setSpeed(1);render();
}

// ================= Actions =================
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.sw&&draft){readSetup();draft[d.sw]=d.c;return setupModal();}
  if(!s&&d.act!=='setup-save')return;
  if(d.v){readPlan();if(d.v!=='course'&&ui.speed)setSpeed(0);ui.view=d.v;render();window.scrollTo(0,0);return;}
  if(d.sort){const st=ui.sort[d.tbl];ui.sort[d.tbl]=st&&st.k===d.sort?{k:d.sort,dir:st.dir==='asc'?'desc':'asc'}:{k:d.sort,dir:DESC.has(d.sort)?'desc':'asc'};return render();}
  if(d.st){ui.stand=d.st;return render();}
  if(b.id==='play')return playBtn();
  if(b.id==='reset'){if(armed(b,'Confirmer : tout effacer ?')){setSpeed(0);s=null;try{localStorage.removeItem(KEY)}catch(err){}draft=null;setupModal(true);}return;}
  const id=Number(d.id),i=Number(d.i);
  const L=s&&s.live,myCar=di=>L&&L.cars.find(c=>c.me&&c.di===di);
  switch(d.act){
    case 'setup-save':{readSetup();const n=draft.name.trim(),sh=draft.short.trim().toUpperCase();if(!n||!sh)return toast('Donne un nom et un sigle.',true);
      if(draft.first)fresh({name:n,short:sh,a:draft.a,b:draft.b});else{const old=s.team;s.team=n;s.short=sh;s.colors={a:draft.a,b:draft.b};if(s.tStand[old]!=null){s.tStand[n]=s.tStand[old];delete s.tStand[old];}}
      draft=null;closeModal();save();ui.view='qg';return render();}
    case 'customize':return setupModal(false);
    case 'close-modal':{pendingImport=null;draft=null;closeModal();return render();}
    case 'quali':{readPlan();if(!s.sponsor){toast('Choisis d\'abord un sponsor titre.',true);ui.view='business';return render();}if(s.drivers.length<2){toast('Il te faut deux pilotes.',true);ui.view='pilotes';return render();}runQuali();return render();}
    case 'start-race':{startRace();setSpeed(1);return render();}
    case 'ptyre':{s.plan.tyres[i]=d.k;save();return render();}
    case 'apply-reco':{s.plan.setup=s.reco.setup;s.plan.tyres=s.reco.tyres.slice();save();return render();}
    case 'speed':return (setSpeed(Number(d.k)),render());
    case 'step':{setSpeed(0);lapStep();afterLap();return;}
    case 'finish':{setSpeed(0);finishNow();afterLap();refreshStaffPool();return render();}
    case 'mode':{const c=myCar(i);if(c){c.mode=Number(d.k);}return render();}
    case 'box':{const c=myCar(i);if(c){c.box=c.box===d.k?null:d.k;c.auto=false;}return render();}
    case 'order':{teamOrder();return render();}
    case 'after-ok':{s.live=null;save();if(done()){ui.view='qg';render();endSeason();return showEnd();}ui.view='qg';return render();}
    case 'show-race':return showRace();
    case 'end':{closeModal();if(!s.end)endSeason();return showEnd();}
    case 'promote':{newSeason(true);closeModal();return render();}
    case 'stay':{newSeason(false);closeModal();return render();}
    case 'new-game':{s=null;try{localStorage.removeItem(KEY)}catch(err){}closeModal();draft=null;return setupModal(true);}
    case 'sponsor':{const o=s.offers.find(x=>x.name===d.name);if(!o)return;s.sponsor={...o};news('Sponsor titre signé : '+o.name+' pour '+o.yrs+' saison'+(o.yrs>1?'s':'')+'.');save();return render();}
    case 'renew-d':{const dr=s.drivers.find(x=>x.id===id);if(!dr)return;renewDriver(dr,2);save();toast(nm(dr)+' prolonge.');return render();}
    case 'renew-s':{renewStaff(d.k);save();return render();}
    case 'renew-sp':{s.sponsor.yrs+=2;news(s.sponsor.name+' prolonge de 2 saisons.');save();return render();}
    case 'dismiss':{s.alerts=s.alerts.filter(a=>String(a.k)!==d.k);save();return render();}
    case 'n1-yes':{const dr=s.drivers.find(x=>x.id===id),o=s.drivers.find(x=>x.id!==id);s.n1=id;dr.morale=clamp(dr.morale+12,0,100);if(o){o.morale=clamp(o.morale-(has(o,'lead')?15:8),0,100);s.rival=Math.min(100,s.rival+10);}s.alerts=s.alerts.filter(a=>String(a.k)!==d.k);news(nm(dr)+' devient le pilote n°1 de l\'écurie.');save();return render();}
    case 'n1-no':{const dr=s.drivers.find(x=>x.id===id);dr.morale=clamp(dr.morale-10,0,100);s.rival=Math.min(100,s.rival+6);s.alerts=s.alerts.filter(a=>String(a.k)!==d.k);save();return render();}
    case 'status':{const nid=id||null;if(s.n1===nid)return;s.n1=nid;const dr=s.drivers.find(x=>x.id===nid),o=s.drivers.find(x=>x.id!==nid);if(dr){dr.morale=clamp(dr.morale+8,0,100);if(o){o.morale=clamp(o.morale-(has(o,'lead')?15:8),0,100);s.rival=Math.min(100,s.rival+10);}}else{s.drivers.forEach(x=>{if(has(x,'lead'))x.morale=clamp(x.morale-6,0,100);});}save();return render();}
    case 'meeting':{s.rival=Math.max(0,s.rival-18);s.meetCd=3;news('Réunion d\'équipe : les pilotes crèvent l\'abcès.');toast('La tension retombe.');save();return render();}
    case 'lock-j':{const j=s.academy.find(x=>x.id===id),fee=j.place==='f3'?150e3:400e3;if(s.cash<fee)return;s.cash-=fee;led('Contrat longue durée · '+nm(j),-fee);j.locked=1;s.alerts=s.alerts.filter(a=>String(a.k)!==d.k);news(nm(j)+' signe un contrat longue durée avec l\'académie.');save();return render();}
    case 'place':{const j=s.academy.find(x=>x.id===id);if(!j)return;j.place=d.k||null;j.jst={pts:0,starts:0,wins:0,pod:0,last:null};news(d.k?nm(j)+' court désormais en '+SER[d.k].n+' pour l\'académie.':nm(j)+' revient au simulateur.');save();return render();}
    case 'release':{const dr=s.drivers[i];const comp=Math.max(0,dr.contract.sal)*0.5;if(!armed(b,comp?'Confirmer ('+meur(comp)+')':'Confirmer'))return;s.cash-=comp;if(comp)led('Indemnité '+nm(dr),-comp);s.drivers.splice(i,1);if(s.n1===dr.id)s.n1=null;hofCheck(dr);news(nm(dr)+' quitte l\'écurie.');save();return render();}
    case 'sign':{const dr=s.fa.find(x=>x.id===id);if(!dr||s.drivers.length>=2)return;const yrs=Number($('dy-'+id).value);s.fa=s.fa.filter(x=>x!==dr);signDriver(dr,yrs);toast(nm(dr)+' a signé');save();return render();}
    case 'sign-j':{const j=s.juniorPool.find(x=>x.id===id);if(!j||s.academy.length>=4)return;if(s.cash<j.fee)return toast('Trésorerie insuffisante.',true);s.cash-=j.fee;led('Recrutement junior '+nm(j),-j.fee);s.juniorPool=s.juniorPool.filter(x=>x!==j);j.jst={pts:0,starts:0,wins:0,pod:0,last:null};s.academy.push(j);news(nm(j)+' ('+j.age+' ans) rejoint l\'académie.');save();return render();}
    case 'drop-j':{if(!armed(b,'Confirmer'))return;s.academy=s.academy.filter(x=>x.id!==id);save();return render();}
    case 'promote-j':{const j=s.academy.find(x=>x.id===id);if(!j||s.drivers.length>=2||j.age<juniorAge(s.ser))return;s.academy=s.academy.filter(x=>x!==j);j.place=null;j.contract={yrs:3,sal:Math.max(0,askFor(j,s.ser))};s.drivers.push(j);news('Le junior '+nm(j)+' est titularisé !');save();return render();}
    case 'hire':{const k=d.k,c=s.staffPool[k].find(x=>x.id===id);if(!c||!staffWilling(c))return;const old=s.staff[k];c.yrs=Math.max(c.yrs,2);s.staff[k]=c;s.staffPool[k]=s.staffPool[k].filter(x=>x!==c);s.staffPool[k].push(old);news(c.name+' devient '+ROLES[k].toLowerCase()+'.');save();return render();}
    case 'engine':{if(s.race>0)return;s.engine=d.i==='own'?'own':i;news('Moteur choisi : '+(d.i==='own'?'moteur maison':ENGINES[i].n)+'.');save();return render();}
    case 'dev':return startDev(d.k);
    case 'dev-cancel':{if(!armed(b,'Confirmer (non remboursé)'))return;return cancelDev(d.k);}
    case 'slot-save':{try{localStorage.setItem(slotKey(d.i),JSON.stringify({at:new Date().toISOString(),sum:summary(s),state:s,uid}));toast('Partie sauvegardée dans l\'emplacement '+d.i);}catch(err){toast('Impossible d\'écrire dans ce navigateur. Utilise l\'export.',true);}return render();}
    case 'slot-load':{const sl=readSlot(d.i);if(!sl)return;if(!armed(b,'Remplacer la partie en cours ?'))return;setSpeed(0);s=sl.state;s.me={name:s.team};uid=Math.max(uid,sl.uid||0)+1;save();ui.view='qg';render();toast('Partie chargée');return;}
    case 'slot-del':{if(!armed(b,'Confirmer'))return;try{localStorage.removeItem(slotKey(d.i))}catch(err){}return render();}
    case 'export-file':{if(!dl)return;const slug=s.team.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/gi,'-').toLowerCase();dl.save({filename:slug+'-'+s.year+'.json',data:exportText()}).then(()=>toast('Fichier enregistré')).catch(err=>{if(err&&err.code==='declined')return;toast('Téléchargement indisponible ici. Utilise « Copier le code ».',true);});return;}
    case 'export-copy':{const ta=$('exp-code'),fb=()=>{ta.focus();ta.select();toast('Code sélectionné : copie-le avec Ctrl+C.');};try{navigator.clipboard.writeText(exportText()).then(()=>toast('Code de sauvegarde copié')).catch(fb);}catch(err){fb();}return;}
    case 'import-text':{const t=$('imp-text').value.trim();if(!t)return toast('Colle d\'abord un code de sauvegarde.',true);return askImport(t);}
    case 'import-confirm':{if(!pendingImport)return;setSpeed(0);s=pendingImport.st;s.me={name:s.team};uid=Math.max(uid,pendingImport.uid)+1;pendingImport=null;save();closeModal();ui.view='qg';render();toast('Partie chargée');return;}
  }
});
function askImport(t){try{pendingImport=parseSave(t);}catch(err){return toast(err.message,true);}
  modal(`<p class="big-title">Charger cette partie ?</p><p style="margin:0"><b>${esc(summary(pendingImport.st))}</b></p><p class="note" style="margin:0">La partie en cours sera remplacée.</p><div class="inline"><button class="btn primary" data-act="import-confirm">Charger</button><button class="btn" data-act="close-modal">Annuler</button></div>`);}
document.addEventListener('change',e=>{const t=e.target;
  if(draft&&(t.id==='custom-a'||t.id==='custom-b')){readSetup();draft[t.id.slice(-1)]=t.value;return setupModal();}
  if(!s)return;
  if(t.dataset&&t.dataset.act==='auto'){const c=s.live&&s.live.cars.find(x=>x.me&&x.di===Number(t.dataset.i));if(c){c.auto=t.checked;if(c.auto)c.box=null;}return render();}
  if(t.id==='pl-setup'){readPlan();save();return;}
  if(t.id==='imp-file'){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>askImport(String(r.result));r.readAsText(f);t.value='';}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden&&s&&!s.over&&!draft&&!s.end)closeModal();});
if(load()){if(s.live&&!s.live.done)ui.view='course';render();if(s.end)showEnd();}else setupModal(true);
</script>

</body></html>
