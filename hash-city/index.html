<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hash City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DDE3EE; --surface:rgba(255,255,255,.94); --text:#17153A; --muted:#5A5878;
  --accent:#3B33A8; --amber:#F2A93B; --line:rgba(23,21,58,.14); --warn:#C2410C; --shadow:0 8px 24px rgba(23,21,58,.18);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0C24; --surface:rgba(22,20,52,.93); --text:#EEEDF9; --muted:#A9A7C9;
    --accent:#8C84FF; --line:rgba(238,237,249,.16); --warn:#FB923C; --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0C24; --surface:rgba(22,20,52,.93); --text:#EEEDF9; --muted:#A9A7C9;
  --accent:#8C84FF; --line:rgba(238,237,249,.16); --warn:#FB923C; --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

#board{all:unset;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;padding:8px 16px 8px 18px;background:#23205C;color:#fff;border-radius:18px;
  box-shadow:var(--shadow);z-index:3;white-space:nowrap;cursor:pointer;max-width:calc(100vw - 20px)}
#board:focus-visible{outline:3px solid var(--amber)}
#cityName{font-weight:800;font-size:20px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tm{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;border-left:1px solid rgba(255,255,255,.25);padding-left:12px}
#clock{font-weight:700;font-size:20px;color:var(--amber);font-variant-numeric:tabular-nums}
#phase{font-size:12px;opacity:.8}

#views{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
#views button{font:500 13px "Archivo",sans-serif;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
#views button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
#editBtn{font-weight:700!important}

#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:3;align-items:center}
#hint{background:var(--surface);color:var(--muted);font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);transition:opacity .6s;text-align:center;max-width:92vw}
#hint.gone{opacity:0}
#feed{display:flex;flex-direction:column;gap:6px;align-items:flex-start;width:100%;max-width:640px}
.toast{background:var(--surface);color:var(--text);border-left:4px solid var(--accent);padding:8px 12px;border-radius:10px;font:500 14px/1.3 "Archivo",sans-serif;box-shadow:var(--shadow);max-width:min(92vw,420px);animation:tin .3s ease-out;transition:opacity .4s}
.toast.warn{border-left-color:var(--warn)}
.toast.out{opacity:0}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#kpis{pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border-radius:16px;padding:6px;border:1px solid var(--line);box-shadow:var(--shadow);max-width:640px;width:100%}
.kpi{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:6px 8px;border-radius:10px;min-width:0}
.kpi:hover{background:rgba(59,51,168,.08)}
.kpi:focus-visible{outline:3px solid var(--amber)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#edit{pointer-events:auto;width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px}
.ehint{margin:0 4px;font-size:13px;color:var(--muted)}
#pal{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#pal::-webkit-scrollbar{display:none}
#pal button{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--text);font:500 14px "Archivo",sans-serif;cursor:pointer}
#pal button[aria-checked="true"]{border-color:var(--accent);background:rgba(59,51,168,.12);font-weight:700}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.erow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nm{display:flex;align-items:center;gap:6px;flex:1 1 150px;min-width:0}
.nm span{font-size:13px;color:var(--muted)}
#nameIn{flex:1;min-width:0;font:600 15px "Archivo",sans-serif;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text)}
.erow button{font:500 13px "Archivo",sans-serif;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.erow button.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:700}
.erow button:disabled{opacity:.4;cursor:default}

#sheet{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:440px;margin:0 auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px 16px;transform:translateY(130%);transition:transform .25s ease-out;z-index:5;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#sheet.open{transform:none}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#shT{margin:0;font-weight:800;font-size:22px;line-height:1.15;letter-spacing:-.01em}
#shS{margin:3px 0 0;color:var(--muted);font-size:14px}
#shX{font:500 13px "Archivo",sans-serif;border:1px solid var(--line);background:transparent;color:var(--text);padding:6px 12px;border-radius:999px;cursor:pointer}
#shR{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:12px 0 0}
#shR dt{color:var(--muted);font-size:14px}
#shR dd{margin:0;font-weight:700;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:16px}

#money{font-weight:700;font-size:15px;color:#BFF0C9;font-variant-numeric:tabular-nums}
#money.neg{color:#FF8A7A}
.cn{display:flex;flex-direction:column;line-height:1.15;min-width:0}
#goal{all:unset;pointer-events:auto;cursor:pointer;width:100%;max-width:640px;box-sizing:border-box;background:#23205C;color:#fff;border-radius:14px;padding:9px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px}
#goal:focus-visible{outline:3px solid var(--amber)}
.g1{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px}
.g1 span:last-child{color:var(--amber);font-variant-numeric:tabular-nums}
#gNext{font-size:13px;opacity:.85}
.gbar{height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--amber);width:0;transition:width .4s}
#pal button small{font-size:12px;color:var(--muted);font-weight:500}
#pal button:disabled{opacity:.45;cursor:not-allowed}
#shA{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#shA:empty{display:none}
#shA button{font:600 13px "Archivo",sans-serif;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
#modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(13,12,36,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.mbox{width:100%;max-width:420px;background:var(--surface);color:var(--text);border-radius:22px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.mbox h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em}
#mMsg{margin:0;color:var(--muted);font-size:15px;line-height:1.4}
.mopt{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line)}
.mopt:hover{border-color:var(--accent)}
.mopt:focus-visible{outline:3px solid var(--amber)}
.mopt b{font-size:17px}
.mopt span{font-size:14px;color:var(--muted);line-height:1.35}
#mMaire{background:#23205C;color:#fff;border-color:transparent}
#mMaire span{color:rgba(255,255,255,.8)}
.mlink{all:unset;cursor:pointer;font-size:13px;color:var(--muted);text-decoration:underline;align-self:center;padding:4px}
@media (max-width:420px){
  .kpi .v{font-size:16px}
  .kpi{padding:5px 6px}
  #views button{padding:7px 10px;font-size:12.5px}
}
@media (min-width:900px){
  #sheet{left:auto;right:16px;top:calc(env(safe-area-inset-top,0px) + 16px);bottom:auto;width:360px;transform:translateX(130%)}
  #sheet.open{transform:none}
}
@media (prefers-reduced-motion:reduce){
  .toast{animation:none}
  #sheet,#hint{transition:none}
}
</style>
</head>
<body>
<canvas id="scene" aria-label="Hash City en 3D"></canvas>

<button id="board" aria-label="Voir les chiffres de la ville">
  <span class="cn"><span id="cityName">Hash City</span><span id="money" hidden>0 €</span></span>
  <span class="tm"><span id="clock">07:00</span><span id="phase">Matin</span></span>
</button>

<div id="views">
  <button data-v="ensemble" aria-pressed="true">Ensemble</button>
  <button data-v="sol" aria-pressed="false">Au sol</button>
  <button id="speedBtn" aria-pressed="false">Temps ×1</button>
  <button id="editBtn" aria-pressed="false">Modifier</button>
</div>

<div id="bottom">
  <div id="hint">Fais glisser pour tourner, pince pour zoomer. Touche un bâtiment, une voiture ou une station.</div>
  <div id="feed"></div>
  <button id="goal" hidden><span class="g1"><span id="gName">Village</span><span id="gCount">0/3</span></span><span id="gNext"></span><span class="gbar"><i id="gBar"></i></span></button>
  <div id="kpis">
    <button class="kpi"><span class="l" id="kl0">Habitants</span><span class="v" id="kPop">0</span></button>
    <button class="kpi"><span class="l" id="kl1">Emplois</span><span class="v" id="kEmp">0</span></button>
    <button class="kpi"><span class="l" id="kl2">Trafic</span><span class="v" id="kTraf">Fluide</span></button>
    <button class="kpi"><span class="l" id="kl3">Énergie</span><span class="v" id="kNrj">0 MW</span></button>
  </div>
  <div id="edit" hidden>
    <p class="ehint" id="eHint">Choisis un élément, puis touche une case pour construire.</p>
    <div id="pal" role="radiogroup" aria-label="Éléments à construire"></div>
    <div class="erow">
      <label class="nm"><span>Nom</span><input id="nameIn" maxlength="22" autocomplete="off" spellcheck="false"></label>
      <button id="undoBtn">Annuler</button>
      <button id="resetBtn">Réinitialiser</button>
      <button id="doneBtn" class="primary">Terminé</button>
    </div>
  </div>
</div>

<div id="sheet" role="dialog" aria-label="Détails">
  <div class="sh-head"><div><h2 id="shT"></h2><p id="shS"></p></div><button id="shX">Fermer</button></div>
  <dl id="shR"></dl>
  <div id="shA"></div>
</div>

<div id="modal" hidden>
  <div class="mbox">
    <h1>Hash City</h1>
    <p id="mMsg">Choisis comment jouer.</p>
    <button class="mopt" id="mMaire"><b>Mode maire</b><span id="mMaireSub"></span></button>
    <button class="mopt" id="mLibre"><b>Mode libre</b><span>Construis ce que tu veux, sans budget ni objectif.</span></button>
    <button id="mNew" class="mlink" hidden>Nouvelle partie en mode maire (efface la partie en cours)</button>
    <button id="mBack" class="mlink" hidden>Retour à la ville</button>
  </div>
</div>

<div id="err">Ton appareil ne prend pas en charge la 3D (WebGL), la ville ne peut pas s’afficher.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const N=20,S=7,HALF=(N-1)/2,RING=80,PERIM=8*RING;
const tx=i=>(i-HALF)*S, tz=j=>(j-HALF)*S;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.round(n).toLocaleString("fr-FR");
const hash=(i,j,k)=>{const s=Math.sin(i*127.1+j*311.7+k*74.7)*43758.5453;return s-Math.floor(s);};
const gauss=(x,m,s)=>Math.exp(-((x-m)*(x-m))/(2*s*s));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const V3=THREE.Vector3;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const VALID="RBHTCUPW.";
const LABEL={".":"Terrain libre",R:"Route",B:"Pont",H:"Maison",T:"Immeuble",C:"Commerce",U:"Usine",P:"Parc",W:"Eau"};
const lerpAngle=(a,b,k)=>{let d=b-a;d=Math.atan2(Math.sin(d),Math.cos(d));return a+d*k;};

/* ---------- Renderer & scene ---------- */
const canvas=$("scene");
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){$("err").style.display="flex";return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xBFDDF0);
scene.fog=new THREE.Fog(0xBFDDF0,230,460);
const camera=new THREE.PerspectiveCamera(42,1,0.5,1200);
const hemi=new THREE.HemisphereLight(0xffffff,0x6d7f75,0.8); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.75);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-100,right:100,top:100,bottom:-100,near:10,far:400});
scene.add(sun); scene.add(sun.target);

const dummy=new THREE.Object3D(), tmpCol=new THREE.Color();
const unitBox=new THREE.BoxGeometry(1,1,1); unitBox.translate(0,0.5,0);
const unitCyl=new THREE.CylinderGeometry(0.5,0.5,1,8); unitCyl.translate(0,0.5,0);
const pyr=new THREE.ConeGeometry(0.75,1,4); pyr.rotateY(Math.PI/4); pyr.translate(0,0.5,0);
const crownGeo=new THREE.IcosahedronGeometry(1,0);
const sphGeo=new THREE.SphereGeometry(0.5,10,8);
const mats={}; const mat=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c}));

/* Window textures */
function winTex(lit){
  const c=document.createElement("canvas"); c.width=64; c.height=128; const g=c.getContext("2d");
  g.fillStyle=lit?"#000":"#fff"; g.fillRect(0,0,64,128);
  for(let r=0;r<8;r++) for(let k=0;k<4;k++){
    if(lit){ if(Math.random()<0.4){g.fillStyle="#FFD58A";g.fillRect(4+k*15,5+r*15,9,9);} }
    else { g.fillStyle="#46607A"; g.fillRect(4+k*15,5+r*15,9,9); }
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
const winBase=winTex(false), winLit=winTex(true);
const TH=[14,22,32];
const towerMats=TH.map(h=>{
  const a=winBase.clone(); a.needsUpdate=true; a.repeat.set(0.62,h/25.6);
  const b=winLit.clone(); b.needsUpdate=true; b.repeat.set(0.62,h/25.6);
  return new THREE.MeshLambertMaterial({color:0xffffff,map:a,emissive:0xFFD27A,emissiveMap:b,emissiveIntensity:0});
});
const slabMat=new THREE.MeshLambertMaterial({color:0xffffff});
const glowMat=new THREE.MeshLambertMaterial({color:0xffffff,emissive:0xFFD58A,emissiveIntensity:0});
const smokeMat=new THREE.MeshLambertMaterial({color:0xEDEDED,transparent:true,opacity:0.6,depthWrite:false});
const bulbMat=new THREE.MeshBasicMaterial({color:0xffffff});
const KIND={
  slab:{g:unitBox,m:slabMat,cast:true}, cyl:{g:unitCyl,m:slabMat,cast:true}, roof:{g:pyr,m:slabMat,cast:true},
  crown:{g:crownGeo,m:slabMat,cast:true}, t0:{g:unitBox,m:towerMats[0],cast:true}, t1:{g:unitBox,m:towerMats[1],cast:true},
  t2:{g:unitBox,m:towerMats[2],cast:true}, glow:{g:unitBox,m:glowMat,cast:false}, bulb:{g:sphGeo,m:bulbMat,cast:false},
  smoke:{g:sphGeo,m:smokeMat,cast:false}
};

/* Labels */
const redraws=[], clickables=[];
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function makeLabel(text,x,y,z,w){
  const c=document.createElement("canvas"); c.width=512; c.height=128; const tex=new THREE.CanvasTexture(c);
  const draw=()=>{const g=c.getContext("2d");g.clearRect(0,0,512,128);g.font='700 52px "Archivo",sans-serif';
    const tw=Math.min(500,g.measureText(text).width+60),x0=(512-tw)/2;
    g.fillStyle="rgba(35,32,92,0.93)";rr(g,x0,22,tw,84,42);g.fill();g.strokeStyle="#F2A93B";g.lineWidth=4;g.stroke();
    g.fillStyle="#fff";g.textAlign="center";g.textBaseline="middle";g.fillText(text,256,66);tex.needsUpdate=true;};
  draw(); redraws.push(draw);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthWrite:false})); s.scale.set(w,w/4,1); s.position.set(x,y,z); scene.add(s); return s;
}
function box(w,h,d,c,x,y,z,parent,cast){const m=new THREE.Mesh(unitBox,mat(c));m.scale.set(w,h,d);m.position.set(x,y,z);m.castShadow=cast!==false;m.receiveShadow=true;(parent||scene).add(m);return m;}

/* ---------- Ground & surroundings (static) ---------- */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),mat(0x8DBA7A));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
(function surroundings(){
  const trees=[];
  for(let k=0;k<160;k++){
    const a=rnd(0,Math.PI*2), d=rnd(90,190), x=Math.cos(a)*d, z=Math.sin(a)*d;
    if(Math.abs(Math.abs(x)-RING)<6&&Math.abs(z)<RING+6) continue;
    if(Math.abs(Math.abs(z)-RING)<6&&Math.abs(x)<RING+6) continue;
    trees.push([x,z,rnd(1.2,2.2)]);
  }
  const tr=new THREE.InstancedMesh(unitCyl,slabMat,trees.length), cr=new THREE.InstancedMesh(crownGeo,slabMat,trees.length);
  trees.forEach(([x,z,s],n)=>{
    dummy.rotation.set(0,0,0);
    dummy.position.set(x,0,z);dummy.scale.set(0.5,2,0.5);dummy.updateMatrix();tr.setMatrixAt(n,dummy.matrix);tr.setColorAt(n,tmpCol.setHex(0x6B4F3A));
    dummy.position.set(x,2+1.4*s,z);dummy.scale.set(1.5*s,1.8*s,1.5*s);dummy.updateMatrix();cr.setMatrixAt(n,dummy.matrix);cr.setColorAt(n,tmpCol.setHex(pickOne([0x3E8E4F,0x2F7A43,0x4FA05C,0x5C9E48])));
  });
  tr.castShadow=cr.castShadow=true; scene.add(tr); scene.add(cr);
  const hillGeo=new THREE.ConeGeometry(1,1,7);
  for(let k=0;k<11;k++){
    const a=k/11*Math.PI*2+rnd(-0.2,0.2), d=rnd(300,360), h=rnd(35,70);
    const m=new THREE.Mesh(hillGeo,mat(pickOne([0x6E9A6A,0x7FA474,0x5F8C63])));
    m.scale.set(rnd(50,80),h,rnd(50,80)); m.position.set(Math.cos(a)*d,h/2,Math.sin(a)*d); scene.add(m);
  }
})();

/* ---------- Map ---------- */
const ROADROWS=[2,7,12,17], ROADCOLS=[2,6,9,15,18];
function defaultMap(){
  const m=[];

    const riverCols=j<10?[11,12]:[12,13];
    const river=riverCols.includes(i), rrow=ROADROWS.includes(j), rcol=ROADCOLS.includes(i), r=hash(i,j,1);
    let t;
    if(river) t=rrow?"B":"W";
    else if(rrow||rcol) t="R";
    else if(i>=14&&j<=6) t=(i>=16&&i<=17&&j>=4&&j<=5)?"W":"P";
    else if(i>=14&&j>=13) t=r<0.82?"U":".";
    else if(i>=3&&i<=10&&j>=8&&j<=16) t=i>=7?(r<0.85?"T":"C"):(r<0.55?"C":"T");
    else if(j<=6&&i<=10) t=r<0.12?"P":"H";
    else if(i>=13&&j>=7&&j<=12) t=r<0.5?"C":"H";
    else t=r<0.65?"H":r<0.85?"C":".";

      if((riverCols.includes(i-1)||riverCols.includes(i+1))&&r>0.55) t="P";
      if((i===0||j===0||i===N-1||j===N-1)&&hash(i,j,2)<0.3) t=".";
    }
    row.push(t);
  } m.push(row);}
  return m;
}

function updateCamera(dt){
  if(cam.follow) cam.target.lerp(cam.follow(),1-Math.exp(-dt*5));
  if(goal){
    const k=1-Math.exp(-dt*3.2); let dth=goal.th-cam.theta; dth=Math.atan2(Math.sin(dth),Math.cos(dth));
    cam.theta+=dth*k; cam.phi+=(goal.ph-cam.phi)*k; cam.r+=(goal.r-cam.r)*k; if(goal.t) cam.target.lerp(goal.t,k);
    if(Math.abs(dth)<0.002&&Math.abs(goal.r-cam.r)<0.05&&Math.abs(goal.ph-cam.phi)<0.002&&(!goal.t||cam.target.distanceTo(goal.t)<0.05)) goal=null;
  }
  const sp=Math.sin(cam.phi);
  camera.position.set(cam.target.x+cam.r*sp*Math.sin(cam.theta),cam.target.y+cam.r*Math.cos(cam.phi),cam.target.z+cam.r*sp*Math.cos(cam.theta));
  camera.lookAt(cam.target);
}

const ptrs=new Map(); let down=null, pinch=null;
const hint=$("hint"); let hinted=false;
function hideHint(){if(!hinted){hinted=true;hint.classList.add("gone");setTimeout(()=>hint.remove(),700);}}
setTimeout(hideHint,9000);
function pan(dx,dy){
  cam.follow=null; const k=cam.r*0.0018, th=cam.theta;
  cam.target.x+=-Math.cos(th)*dx*k-Math.sin(th)*dy*k; cam.target.z+=Math.sin(th)*dx*k-Math.cos(th)*dy*k;
  cam.target.x=clamp(cam.target.x,-120,120); cam.target.z=clamp(cam.target.z,-120,120);
}
canvas.addEventListener("pointerdown",e=>{
  hideHint(); canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1) down={x:e.clientX,y:e.clientY,t:performance.now(),moved:0,pan:e.button===2||e.shiftKey};
  else{down=null;const a=[...ptrs.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2};}
});
canvas.addEventListener("pointermove",e=>{
  const prev=ptrs.get(e.pointerId); if(!prev) return;
  const dx=e.clientX-prev.x, dy=e.clientY-prev.y; prev.x=e.clientX; prev.y=e.clientY;
  if(ptrs.size===1&&down){
    down.moved+=Math.abs(dx)+Math.abs(dy); if(down.moved>4) unpress();
    if(down.pan) pan(dx,dy); else{cam.theta-=dx*0.006;cam.phi=clamp(cam.phi-dy*0.005,0.15,1.42);}
  }else if(ptrs.size===2&&pinch){
    unpress();
    const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
    if(d>0) cam.r=clamp(cam.r*pinch.d/d,12,320);
    if(Math.hypot(mx-pinch.mx,my-pinch.my)>0.5) pan(mx-pinch.mx,my-pinch.my);
    pinch={d,mx,my};
  }
});
function endPtr(e){
  if(down&&ptrs.size===1&&down.moved<8&&performance.now()-down.t<500) pickAt(e.clientX,e.clientY);
  ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
  if(ptrs.size===1){const p=[...ptrs.values()][0];down={x:p.x,y:p.y,t:0,moved:99,pan:false};} else if(!ptrs.size) down=null;
}
canvas.addEventListener("pointerup",endPtr);
canvas.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);pinch=null;down=null;});

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), groundPlane=new THREE.Plane(new V3(0,1,0),0), hitP=new V3();
function pickAt(x,y){
  const rect=canvas.getBoundingClientRect();
  ndc.set(((x-rect.left)/rect.width)*2-1,-((y-rect.top)/rect.height)*2+1); ray.setFromCamera(ndc,camera);
  const objs=editMode?cityMeshes:[vBody,vTop,...trainCars,...stationObjs,...cityMeshes];
  const hits=ray.intersectObjects(objs,true);
  for(const h of hits){
    const o=h.object;
    if(o===vBody||o===vTop){const v=V[h.instanceId];if(v&&v.on){select({kind:"vehicle",idx:h.instanceId});return;}continue;}
    if(o.userData.city){const ti=o.userData.tiles[h.instanceId];if(ti>=0){tileTap(ti%N,Math.floor(ti/N));return;}continue;}
    let p=o; while(p&&!p.userData.kind) p=p.parent;
    if(p){select(Object.assign({},p.userData));return;}
  }
  if(ray.ray.intersectPlane(groundPlane,hitP)){const i=Math.round(hitP.x/S+HALF),j=Math.round(hitP.z/S+HALF);if(inB(i,j)){tileTap(i,j);return;}}
  if(!editMode&&sel) closeSheet();
}

const LC={g:0x2EE06A,y:0xFFC23A,r:0xFF3B30};
function updateLights(){
  if(!refs.bulb) return; let ch=false;
  for(const it of INTERS){const ns=lightState(it,"NS"),ew=lightState(it,"EW");
    if(ns!==it.sn){it.sn=ns;refs.bulb.setColorAt(it.ns,tmpCol.setHex(LC[ns]));ch=true;}
    if(ew!==it.se){it.se=ew;refs.bulb.setColorAt(it.ew,tmpCol.setHex(LC[ew]));ch=true;}}
  if(ch) refs.bulb.instanceColor.needsUpdate=true;
}
function updateSmoke(t){
  if(!refs.smoke) return;
  FACT.forEach(f=>{for(let p=0;p<3;p++){const ph=(t*0.22+p/3+f.s)%1,s=0.7+ph*1.9;
    dummy.position.set(f.x+ph*2.4,f.y+ph*6.5,f.z+ph*0.8);dummy.rotation.set(0,0,0);dummy.scale.set(s,s,s);dummy.updateMatrix();refs.smoke.setMatrixAt(f.base+p,dummy.matrix);}});
  refs.smoke.instanceMatrix.needsUpdate=true;
}

/* ---------- Init & loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<0.8?55:42;camera.updateProjectionMatrix();}
addEventListener("resize",resize); resize();
M=defaultMap(); buildCity(); renderPal();
for(let k=0;k<120;k++){updateVehicles(0);updatePeds(0,0);}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>redraws.forEach(f=>f()));
setView("ensemble",true); updateSky(); applyModeUI(); updateUI(); openModal();

let last=performance.now(), T=0, uiAcc=1, lightAcc=0, jamCool=20;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; T+=dt; CLK+=dt;
  const prevH=hour; hour=(hour+dt*timeMul/8)%24;
  HOUR_MSG.forEach(([h,f])=>{const crossed=prevH<=hour?(prevH<h&&hour>=h):(prevH<h||hour>=h);if(crossed&&timeMul===1)say(f());});
  if(MODE==="maire"&&GM&&!paused){updateGame(dt*timeMul/8);saveAcc+=dt;if(saveAcc>5){saveAcc=0;save();}}
  updateSky(); updateVehicles(dt); drawVehicles(dt); updatePeds(dt,T); updateBoats(dt); updateTrain(dt); updateSmoke(T);
  lightAcc+=dt; if(lightAcc>0.2){lightAcc=0;updateLights();}
  jamCool-=dt;
  if(jamCool<=0&&TRAF.active>14&&TRAF.waiting/TRAF.active>0.5&&INTERS.length){
    let best=null,bn=0; INTERS.forEach(it=>{const n=V.filter(v=>v.on&&v.wait&&v.b[0]===it.i&&v.b[1]===it.j).length;if(n>bn){bn=n;best=it;}});
    if(best&&bn>=3){say("Bouchons au "+interName(best),"warn");jamCool=45;}
  }
  uiAcc+=dt; if(uiAcc>=0.25){uiAcc=0;updateUI();}
  if(cursor.visible&&cursorT!==Infinity){cursorT-=dt;if(cursorT<=0)cursor.visible=false;}
  if(sel&&(sel.kind==="vehicle")){const v=V[sel.idx];ring.visible=v.on;ring.position.set(v.pos.x,v.pos.y+0.05,v.pos.z);ring.scale.setScalar(v.type==="car"?1:1.7);}
  else ring.visible=false;
  updateCamera(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
