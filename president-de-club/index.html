<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Président de Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Layout : bureau du président — tableau d'affichage en haut (trésorerie, journée, bilan), onglets latéraux, et une échelle des divisions comme fil conducteur de la carrière. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#101A2A; --muted:#5B6678; --line:#D4DAE3;
  --club-a:#E0611A; --club-b:#1E3F8F; --club-a-ink:#FFFFFF;
  --accent:var(--club-a); --accent-ink:var(--club-a-ink); --accent-soft:color-mix(in srgb,var(--club-a) 16%,var(--surface)); --accent-text:color-mix(in srgb,var(--club-a) 78%,var(--ink));
  --court:color-mix(in srgb,var(--club-b) 85%,var(--ink)); --court-soft:color-mix(in srgb,var(--club-b) 14%,var(--surface));
  --ok:#14804A; --ok-soft:#DAF0E3; --warn:#9A6408; --warn-soft:#F6EBD3; --bad:#B8321F; --bad-soft:#F7DFDA;
  --bar2:#A7B1C2;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B111C; --surface:#131B29; --surface-2:#19233404; --surface-2:#1A2436; --ink:#E6EBF3; --muted:#94A0B4; --line:#283449;
  --accent:color-mix(in srgb,var(--club-a) 85%,#fff); --accent-ink:var(--club-a-ink); --accent-soft:color-mix(in srgb,var(--club-a) 24%,var(--surface)); --accent-text:color-mix(in srgb,var(--club-a) 70%,var(--ink));
  --court:color-mix(in srgb,var(--club-b) 55%,var(--ink)); --court-soft:color-mix(in srgb,var(--club-b) 26%,var(--surface));
  --ok:#48C584; --ok-soft:#14301F; --warn:#E5B04E; --warn-soft:#332710; --bad:#F27C66; --bad-soft:#3A1C17;
  --bar2:#465369; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B111C; --surface:#131B29; --surface-2:#1A2436; --ink:#E6EBF3; --muted:#94A0B4; --line:#283449;
  --accent:color-mix(in srgb,var(--club-a) 85%,#fff); --accent-ink:var(--club-a-ink); --accent-soft:color-mix(in srgb,var(--club-a) 24%,var(--surface)); --accent-text:color-mix(in srgb,var(--club-a) 70%,var(--ink));
  --court:color-mix(in srgb,var(--club-b) 55%,var(--ink)); --court-soft:color-mix(in srgb,var(--club-b) 26%,var(--surface));
  --ok:#48C584; --ok-soft:#14301F; --warn:#E5B04E; --warn-soft:#332710; --bad:#F27C66; --bad-soft:#3A1C17;
  --bar2:#465369; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:var(--bg);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:.95;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;text-transform:none;opacity:.6;margin-top:6px;line-height:1.3}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;font-weight:600;opacity:.72}
.nav button:hover{opacity:1;background:color-mix(in srgb,var(--bg) 10%,transparent)}
.nav button[aria-current="true"]{opacity:1;background:var(--accent);color:var(--accent-ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.badge{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;font-size:12px;opacity:.6;display:flex;flex-direction:column;gap:8px}
.side-foot button{all:unset;cursor:pointer;text-decoration:underline}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 26px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.stat{display:flex;flex-direction:column}
.stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stat .val{font-family:var(--f-mono);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.cash .val{font-size:24px;color:var(--ok)}
.stat.cash.neg .val{color:var(--bad)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;padding:9px 20px}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad)}

.view{padding-block:24px 56px;padding-inline:24px;display:flex;flex-direction:column;gap:20px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;margin:0;letter-spacing:.03em}
.sub{color:var(--muted);margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

/* Échelle */
.ladder{display:flex;flex-direction:column-reverse;gap:6px}
.rung{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.rung .lv{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:20px}
.rung .nm{flex:1}
.rung.done{border-color:var(--court);color:var(--court);background:var(--court-soft)}
.rung.now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rung.now .lv{color:inherit;opacity:.8}

/* Match card */
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.match .tm{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.05;text-transform:uppercase}
.match .tm.me{color:var(--accent-text)}
.match .vs{font-family:var(--f-mono);color:var(--muted)}
.score{font-family:var(--f-mono);font-weight:700;font-size:30px}
.compare{display:flex;flex-direction:column;gap:6px}
.cmp-row{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.cmp-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.cmp-bar i{display:block}
.club-name{border:1px dashed transparent;background:transparent;font-family:var(--f-display);font-weight:800;font-size:36px;text-transform:uppercase;line-height:1;padding:0 4px;margin-left:-5px;width:100%;max-width:560px}
.club-name:hover{border-color:var(--line)}
.club-name:focus{border-color:var(--accent);outline:none}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
.wide{min-width:760px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.me td{background:var(--accent-soft);font-weight:700}
tr.promo td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
tr.releg td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.pname{font-weight:600}
.pos{font-family:var(--f-mono);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface-2)}
.ovr{display:inline-grid;place-items:center;min-width:38px;height:28px;border-radius:5px;font-family:var(--f-mono);font-weight:700}
.ovr.hi{background:var(--accent);color:var(--accent-ink)}
.ovr.mid{background:var(--court-soft);color:var(--court)}
.ovr.lo{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)} .pill.acc{background:var(--accent-soft);color:var(--accent-text)}
.wl{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;font-family:var(--f-mono);font-size:12px;font-weight:700}
.wl.w{background:var(--ok-soft);color:var(--ok)} .wl.l{background:var(--bad-soft);color:var(--bad)}
.form{display:flex;gap:3px}
select.sm{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:3px 6px;font-size:13px}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.fac{display:flex;flex-direction:column;gap:10px}
.fac .lvl{display:flex;gap:4px}
.fac .lvl i{flex:1;height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.fac .lvl i.on{background:var(--accent);border-color:var(--accent)}
.fac .eff{font-size:14px}
.fac .cost{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.fac .cost b{font-family:var(--f-mono);color:var(--ink)}
.offer{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface)}
.offer.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.offer .terms{font-family:var(--f-mono);font-size:13px;display:flex;flex-direction:column;gap:2px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-mono);font-size:21px;font-weight:700;margin-top:2px}
.kpi .hint{font-size:12px;color:var(--muted)}
.pos-c{color:var(--ok)} .neg-c{color:var(--bad)}
.news{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}
.news div{font-size:14px;display:flex;gap:8px}
.news .wk{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:42px}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.c-in{fill:var(--accent)} .c-out{fill:var(--bar2)} .c-grid{stroke:var(--line)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;width:110px}

.overlay{position:fixed;inset:0;background:rgba(5,10,20,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:10px;max-width:480px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);max-height:90vh;overflow:auto}
.modal .big-title{font-family:var(--f-display);font-weight:800;font-size:34px;text-transform:uppercase;line-height:1;margin:0}
.ticket{font-family:var(--f-mono);font-size:13px;border:1px dashed var(--line);border-radius:6px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.ticket div{display:flex;justify-content:space-between;gap:10px}
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;display:flex;flex-direction:column;gap:8px;z-index:30}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:14px;font-weight:500;max-width:340px}
.toast.bad{background:var(--bad);color:#fff}

/* Cinq majeur, espoirs, scouts, sauvegardes */
.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.slot{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;min-width:0}
.slot .sp{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.slot .sp b{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;color:var(--court)}
.slot select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 6px;font-size:13px;min-width:0}
.slot .eff{font-family:var(--f-mono);font-size:24px;font-weight:700}
.range{position:relative;height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;width:110px;flex:none}
.range i{position:absolute;top:-1px;bottom:-1px;background:var(--accent);border-radius:99px;opacity:.85;min-width:3px}
.range b{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink)}
.potcell{display:flex;align-items:center;gap:8px;white-space:nowrap}
.spark{display:block}
.spark polyline{fill:none;stroke:var(--court);stroke-width:2;stroke-linejoin:round}
.spark circle{fill:var(--court)}
.stars{color:var(--accent-text);letter-spacing:1px;white-space:nowrap}
.stars span{opacity:.25}
.prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--court)}
textarea.code{width:100%;min-height:110px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:8px;resize:vertical;color:var(--ink)}
.gem{color:var(--accent-text);font-weight:700}
.crest{display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--club-a);color:var(--club-a-ink);box-shadow:0 0 0 3px var(--club-b),0 0 0 5px var(--surface);font-family:var(--f-display);font-weight:800;letter-spacing:.02em;line-height:1}
.brand-row{display:flex;align-items:center;gap:12px}
.side .crest{box-shadow:0 0 0 3px var(--club-b),0 0 0 5px var(--ink)}
.club-head{display:flex;align-items:center;gap:18px;min-width:0}
.club-title{font-family:var(--f-display);font-weight:800;font-size:36px;text-transform:uppercase;line-height:1;margin:0;text-wrap:balance}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.sw-custom{width:38px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--surface)}
.field-full{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;width:100%}
.preview{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.preview .bar{flex:1;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--club-a) 0 60%,var(--club-b) 60% 100%)}
td.num{white-space:nowrap}
.wide td .note{max-width:220px}
.flag{display:inline-block;width:20px;height:13px;border-radius:2px;vertical-align:-1px;margin-right:6px;box-shadow:0 0 0 1px rgba(0,0,0,.18);flex:none;background-size:auto}
.th-sort{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.th-sort:hover,.th-sort.on{color:var(--ink)}
.th-sort:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.th-sort i{font-style:normal;font-size:10px;opacity:.9}
.alert{display:flex;flex-direction:column;gap:10px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:14px 16px}
.alert.urgent{border-color:var(--bad);background:var(--bad-soft)}
.alert h2{color:var(--warn)} .alert.urgent h2{color:var(--bad)}
.alert ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.play-badge{display:inline-block;margin-left:8px;font-family:var(--f-body);font-size:12px;letter-spacing:0;text-transform:none;background:var(--bad);color:#fff;border-radius:99px;padding:2px 8px;vertical-align:2px}
.bids{display:flex;flex-direction:column;gap:8px}
.bid{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
@media (max-width:900px){.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1050px){.cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 16px;overflow-x:auto}
  .brand small,.side-foot{display:none}
  .brand{font-size:20px;white-space:nowrap}
  .nav{flex-direction:row}
  .nav button{padding:7px 10px;white-space:nowrap}
  .top{padding:10px 16px;position:static;gap:8px 16px}
  .view{padding-inline:16px}
  .club-title{font-size:28px}
  .match .tm{font-size:17px}
}
@media (prefers-reduced-motion:no-preference){.btn,.rung,.offer{transition:background .15s,border-color .15s}}
/* ===== Refonte visuelle : plateforme claire et accueillante ===== */
/* Layout : barre latérale claire à icônes, en-tête à fil d'Ariane, cartes blanches arrondies ; la couleur du club sert d'accent. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#141820; --muted:#667085; --line:#E5E7EB; --bar2:#CBD2DC;
  --ok:#12805C; --ok-soft:#E3F4EC; --warn:#A15C07; --warn-soft:#FDF1DE; --bad:#C2321F; --bad-soft:#FCE7E3;
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1015; --surface:#161A21; --surface-2:#1C212A; --ink:#EEF0F4; --muted:#98A2B3; --line:#262C36; --bar2:#3A4250;
  --ok:#3CCB8F; --ok-soft:#12291F; --warn:#E9B04F; --warn-soft:#2E2412; --bad:#F27C66; --bad-soft:#341A16; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1015; --surface:#161A21; --surface-2:#1C212A; --ink:#EEF0F4; --muted:#98A2B3; --line:#262C36; --bar2:#3A4250;

body{font-size:14.5px;letter-spacing:-.005em}

.stat .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .val{font-size:17px}
.num,.stat .val,.kpi .val,.score,.ticket{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.stat .val,.kpi .val{font-weight:800;letter-spacing:-.01em}
.stat.cash .val{font-size:22px}
.view{padding-inline:28px;padding-block:28px 64px;gap:22px;max-width:1320px}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.club-title{font-family:var(--f-display);font-weight:800;font-size:32px;text-transform:none;letter-spacing:-.025em;line-height:1.1}
.sub{font-size:14px}
.panel,.kpi,.tbl-wrap,.offer,.card,.slot{border-radius:var(--r);box-shadow:var(--shadow)}
.panel{padding:20px;gap:14px}
.kpi{padding:16px 18px}
.kpi .val{font-size:22px;letter-spacing:-.01em}
.tbl-wrap .tbl-wrap,.panel .tbl-wrap{box-shadow:none}
th{background:var(--surface-2);font-size:11px;letter-spacing:.06em}
th,td{padding:10px 14px}
tr:hover td{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
tr.me td,tr.me:hover td{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.btn{border-radius:10px;font-weight:600;padding:8px 14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.btn.sm{border-radius:8px;padding:5px 10px}
.btn.big{font-family:var(--f-body);font-size:15px;text-transform:none;letter-spacing:0;padding:11px 20px;border-radius:12px;font-weight:700}
.btn.primary{box-shadow:0 1px 2px rgba(16,24,40,.1),inset 0 -1px 0 rgba(0,0,0,.12)}

.ovr{border-radius:8px}
.pos{border-radius:6px}
.rung{border-radius:10px}
.alert{border-radius:var(--r)}
.alert h2{font-size:15px}
.modal{border-radius:18px;padding:26px;box-shadow:0 20px 50px rgba(16,24,40,.25)}
.modal .big-title{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:none;letter-spacing:-.02em}
.match .tm{font-family:var(--f-display);font-weight:800;text-transform:none;letter-spacing:-.01em;font-size:20px}
.score{font-size:32px}
.chip,.search,select.sm,.field,.field-full{border-radius:9px}
.slot .sp b{font-family:var(--f-display);text-transform:none}
.toast{border-radius:12px;box-shadow:0 8px 24px rgba(16,24,40,.2)}
.stars{color:var(--warn)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);padding:10px 16px}
  .nav button{padding:8px 10px}
  .nav button span:not(.badge){display:inline}
  .top{padding:10px 16px}
  .view{padding-inline:16px}
  h1,.club-title{font-size:26px}
}

const salaryFor=ovr=>Math.max(10,Math.round(4*Math.pow(1.14,ovr-30)/5)*5);

function genPlayer(div,o={}){
  const age=o.age??ri(18,33);
  const ovr=clamp(Math.round(o.ovr??(BASE[div]+rnd(-9,5))),25,95);
  let pot=ovr+(age<=20?ri(8,22):age<=23?ri(4,14):age<=27?ri(0,6):0);
  pot=clamp(pot,ovr,97);
  const nat=o.nat??pickNat(div),pos=o.pos??pick(POS);
  return {id:++uid,...nameFor(nat),nat,h:genHeight(pos,nat),pos,age,ovr,pot,sal:salaryFor(ovr),yrs:o.yrs??ri(1,3),inj:0};
}
function ovrClass(o){const b=BASE[s.div];return o>=b+5?'hi':o>=b-2?'mid':'lo';}
function quotaOut(){const f=s.roster.filter(p=>!p.inj&&isForeign(p)).sort((a,b)=>b.ovr-a.ovr);return new Set(f.slice(QUOTA[s.div]).map(p=>p.id));}
const foreignCount=()=>s.roster.filter(isForeign).length;
const avail=()=>{const q=quotaOut();return s.roster.filter(p=>!p.inj&&!q.has(p.id));};
// Cinq majeur : un poste voisin coûte 3 points, un poste éloigné 8
function effOvr(p,slot){const d=Math.abs(POS.indexOf(p.pos)-POS.indexOf(slot));return p.ovr-(d===0?0:d===1?3:8);}
function resolveLineup(){
  const av=avail(),used=new Set(),out=[];
  s.lineup=(s.lineup||[]).slice(0,5);while(s.lineup.length<5)s.lineup.push(null);
  for(let i=0;i<5;i++){const p=av.find(x=>x.id===s.lineup[i]);if(p&&!used.has(p.id)){used.add(p.id);out[i]={p,sub:false};}}
  for(let i=0;i<5;i++){if(out[i])continue;let best=null,be=-99;av.forEach(p=>{if(used.has(p.id))return;const e=effOvr(p,POS[i]);if(e>be){be=e;best=p;}});
    if(best)used.add(best.id);out[i]={p:best,sub:true};}
  return out.map((o,i)=>({...o,slot:POS[i],eff:o.p?effOvr(o.p,POS[i]):25}));
}
function autoLineup(){
  const pairs=[];avail().forEach(p=>POS.forEach((sl,i)=>pairs.push([effOvr(p,sl),p.id,i])));pairs.sort((a,b)=>b[0]-a[0]);
  const lu=[null,null,null,null,null],used=new Set();
  for(const[,id,i]of pairs){if(lu[i]!==null||used.has(id))continue;lu[i]=id;used.add(id);}
  s.lineup=lu;
}
function rotation(L){const ids=new Set(L.filter(x=>x.p).map(x=>x.p.id));return avail().filter(p=>!ids.has(p.id)).sort((a,b)=>b.ovr-a.ovr).slice(0,3);}
function teamStrength(){
  const L=resolveLineup();const b=rotation(L).map(p=>p.ovr);while(b.length<3)b.push(25);
  const t5=L.reduce((t,x)=>t+x.eff,0)/5,b3=(b[0]+b[1]+b[2])/3;
  return Math.round((0.72*t5+0.28*b3+COACH[s.coach].bonus)*10)/10;
}
// Scouts et espoirs
function gauss(){return (Math.random()+Math.random()+Math.random()-1.5)*2;}
function genScout(div){const stars=clamp(ri(1,3)+Math.floor(div/2)+(Math.random()<.15?1:0),1,5);return {id:++uid,name:pick(FN)+' '+pick(LN),stars,sal:SC_SAL[stars],mission:null};}
const genScoutPool=div=>[0,1,2].map(()=>genScout(div));
function makeProspect(R,stars,pos,origin){
  const age=ri(15,18),pot=clamp(Math.round(R.mu+R.sd*gauss()+stars),42,97);
  const ovrF=clamp(22+(age-15)*4+(pot-60)*0.25+rnd(-4,4),18,58);
  const W=SC_W[stars-1];let lo=clamp(pot-rnd(0,W),30,99),hi=Math.min(99,lo+W);if(hi<pot)hi=pot;
  const mid=(lo+hi)/2;
  const nat=R.nats?wpick(R.nats):pickNat(s.div),ps=pos&&pos!=='Tous'?pos:pick(POS);
  return {id:++uid,...nameFor(nat),nat,h:genHeight(ps,nat),pos:ps,age,ovrF,pot,potLo:lo,potHi:hi,
    fee:Math.round(30*Math.pow(1.075,mid-40)/10)*10,sal:Math.round(5+Math.max(0,mid-50)*0.8),exp:7,origin,hist:[Math.round(ovrF*10)/10]};

function boxScore(score){
  const L=resolveLineup(),rot=rotation(L);
  const ps=[...L.map(x=>({p:x.p,e:x.eff,min:1})),...rot.map(p=>({p,e:p.ovr,min:.45}))];
  for(let i=rot.length;i<3;i++)ps.push({p:null,e:25,min:.45});
  const dist=(total,f)=>{const w=ps.map(x=>Math.pow(Math.max(5,x.e-20),1.4)*x.min*f(x.p)*rnd(.55,1.45));const sw=w.reduce((a,b)=>a+b,0)||1;return w.map(v=>Math.round(total*v/sw));};
  const pts=dist(score,()=>1),reb=dist(ri(30,44),p=>p?({MJ:.5,ARR:.7,AIL:1,AF:1.4,PIV:1.8})[p.pos]*Math.pow((curH(p)||200)/200,3):1),ast=dist(ri(12,24),p=>p?({MJ:2.2,ARR:1.2,AIL:.9,AF:.6,PIV:.4})[p.pos]:1);

  [...st.roster,...st.market,...st.youth,...st.reports].forEach(p=>{if(!p.nat)p.nat='FR';if(!p.h)p.h=genHeight(p.pos,p.nat);});

function genMarket(){s.market=[];for(let i=0;i<14;i++)s.market.push(genPlayer(clamp(s.div+(i<4?1:0),0,6)));}

            {type:'perf',name:n[1],fixed:Math.round(b*.5),win:Math.round(b*1.15)},
            s.div>=6?{type:'titre',name:n[2],fixed:Math.round(b*.6),promo:Math.round(b*6)}:{type:'montee',name:n[2],fixed:Math.round(b*.6),promo:Math.round(b*16)}];

function playWeek(){
  if(s.over)return;
  if(s.week>=WEEKS){return showSeasonEnd();}
  if(!s.sponsor){toast('Choisissez d\'abord un sponsor (onglet Finances).',true);ui.view='finances';return render();}
  if(s.autoLineup)autoLineup();
  const games=s.league.sched[s.week].map(([h,a])=>simGame(h,a));
  s.league.results.push(games);
  const mine=games.find(g=>g.h===0||g.a===0);const home=mine.h===0;
  const won=home?mine.sh>mine.sa:mine.sa>mine.sh;
  const opp=s.league.teams[home?mine.a:mine.h].name;
  const inc={},exp={};
  if(home){
    const st=standings().find(x=>x.me);const wr=(st.w+st.l)?st.w/(st.w+st.l):.5;
    const demand=clamp(1.6-0.6*(s.ticket/REF_PRICE[s.div]),0.1,1.5)*(0.8+0.4*wr)*(1+0.05*(s.fac.parking||0));
    const att=Math.min(FAC.salle.levels[s.fac.salle],Math.round(s.fans*demand));
    inc['Billetterie ('+nf.format(att)+' spectateurs)']=att*s.ticket; s.lastAtt=att;rec('attendance',att,{opp});
    if(s.fac.buvette)inc['Buvette']=att*[0,1.2,2,2.8,3.6][s.fac.buvette]*(1+s.div*0.15);
    if(s.fac.vip)inc['Loges VIP']=VIPREV[s.fac.vip]*(1+s.div*0.4);
    if(s.fac.ecran>=2)inc['Publicité écran géant']=[0,0,200,800][s.fac.ecran]*(1+s.div*0.4);
  }
  if(s.naming)inc['Naming '+s.naming.name]=s.naming.weekly;
  if(!home&&s.fac.salle>=1&&Math.random()<[0,0.12,0.2,0.28,0.35,0.42,0.5][s.fac.salle]){
    const ev=pick(EVENTS[s.fac.salle<=2?0:s.fac.salle<=4?1:2]),gain=Math.round(FAC.salle.levels[s.fac.salle]*rnd(1.2,3.5)*(1+s.div*0.1)/10)*10;
    inc['Événement : '+ev]=gain;news(ev+' dans '+(s.naming?s.naming.name:'ta salle')+' pendant le déplacement de l’équipe : +'+eur.format(gain)+'.');}
  inc['Sponsor '+s.sponsor.name]=s.sponsor.fixed+(won&&s.sponsor.win?s.sponsor.win:0);
  if(s.fac.shop)inc['Boutique']=s.fans*0.06*s.fac.shop*(1+s.div*0.35);
  exp['Salaires joueurs']=s.mecene===s.season?0:payroll();
  if(COACH[s.coach].sal)exp['Salaire entraîneur']=COACH[s.coach].sal;
  exp['Entretien des installations']=Object.keys(s.fac).reduce((t,k)=>t+FAC[k].upkeep[s.fac[k]],0);
  exp['Cellule de recrutement (scouts)']=s.scouts.reduce((t,x)=>t+x.sal,0);
  exp['Salaires espoirs']=s.youth.filter(y=>!y.loan).reduce((t,x)=>t+x.sal,0);
  let ti=0,te=0;
  for(const[k,v]of Object.entries(inc)){if(v>0){led(k,v);ti+=v;}}
  for(const[k,v]of Object.entries(exp)){if(v>0){led(k,-v);te+=v;}}
  s.cash=Math.round(s.cash+ti-te);
  s.weeks.push({w:'S'+s.season+'J'+(s.week+1),inc:Math.round(ti),exp:Math.round(te)});s.weeks=s.weeks.slice(-36);
  // supporters
  s.fans=Math.round(won?s.fans*1.04+3:s.fans*0.985);
  if(home&&s.fac.ecran)s.fans=Math.round(s.fans*(1+0.01*s.fac.ecran));
  // blessures
  s.roster.forEach(p=>{if(p.inj)p.inj--;});
  const injRate=s.fac.train>=2?0.02:0.035;
  s.roster.forEach(p=>{if(!p.inj&&Math.random()<injRate){p.inj=ri(1,4);news(p.fn+' '+p.ln+' est blessé pour '+p.inj+' semaine'+(p.inj>1?'s':'')+'.');}});
  // marché
  for(let i=0;i<2;i++){s.market.splice(ri(0,s.market.length-1),1);s.market.push(genPlayer(clamp(s.div+(Math.random()<.3?1:0),0,6)));}
  const my=home?mine.sh:mine.sa,their=home?mine.sa:mine.sh;
  const box=boxScore(my);let top=null;
  box.forEach(b=>{const p=b.p;p.ss=p.ss||zero();p.car=p.car||{seasons:0,...zero()};
    for(const k of['pts','reb','ast']){p.ss[k]+=b[k];p.car[k]+=b[k];}p.ss.g++;p.car.g++;if(!top||b.pts>top.pts)top=b;});
  if(top&&rec('ptsGame',top.pts,{name:top.p.fn+' '+top.p.ln,opp}))news('Record du club : '+top.p.fn+' '+top.p.ln+' marque '+top.pts+' points contre '+opp+' !');
  if(won)rec('bigWin',my-their,{score:my+'–'+their,opp});
  scoutsTick();youthTick();incomingTick();
  s.last={opp,home,my,their,won,week:s.week+1,top:top?{name:top.p.fn+' '+top.p.ln,pts:top.pts,reb:top.reb,ast:top.ast}:null};
  news((won?'Victoire ':'Défaite ')+s.last.my+'–'+s.last.their+(home?' à domicile contre ':' chez ')+opp+'.'+(top?' Meilleur marqueur : '+top.p.fn+' '+top.p.ln+' ('+top.pts+' pts).':''));
  s.week++;
  save();render();
  toast((won?'Victoire ':'Défaite ')+s.last.my+'–'+s.last.their+' contre '+opp,!won);
  if(s.week>=WEEKS)showSeasonEnd();
}

function seasonResult(){
  const rank=myRank();let outcome='stay';
  if(rank<=2&&s.div<6)outcome='up';
  if(rank>=9&&s.div>0)outcome='down';
  const prize=Math.round(PRIZE[s.div]*(11-rank)/10);
  const obj=rank<=s.objective;const objBonus=obj?Math.round(PRIZE[s.div]*0.5):0;
  const champ=rank===1&&s.div===6;
  const promoBonus=(outcome==='up'||(champ&&s.sponsor&&s.sponsor.type==='titre'))&&s.sponsor&&s.sponsor.promo?s.sponsor.promo:0;
  return {rank,outcome,prize,obj,objBonus,promoBonus,champ};
}

const SORT_KEY=KEY+'-sort';
try{ui.sort=JSON.parse(localStorage.getItem(SORT_KEY))||{};}catch(e){ui.sort={};}
const DESC_FIRST=new Set(['ovr','pot','ppg','sal','req','h']);
const GET={
  pos:p=>POS.indexOf(p.pos),name:p=>(p.ln+' '+p.fn).toLowerCase(),age:p=>p.age,
  ovr:p=>p.ovrF??p.ovr,pot:p=>p.potLo!=null?(p.potLo+p.potHi)/2:p.pot,ppg:p=>p.ss&&p.ss.g?p.ss.pts/p.ss.g:-1,
  sal:p=>p.sal,yrs:p=>p.yrs,h:p=>curH(p),req:p=>minDiv(p.ovr)};
function applySort(list,tbl,fallback){
  const st=ui.sort[tbl];if(!st||!GET[st.k])return list.sort(fallback);
  const g=GET[st.k],m=st.dir==='asc'?1:-1;
  return list.sort((a,b)=>{const x=g(a),y=g(b);return (x<y?-1:x>y?1:0)*m||fallback(a,b);});
}
function th(tbl,k,label,right){
  const st=ui.sort[tbl],on=st&&st.k===k,arrow=on?(st.dir==='asc'?'▲':'▼'):'';
  return `<th class="${right?'r':''}" ${on?`aria-sort="${st.dir==='asc'?'ascending':'descending'}"`:''}><button class="th-sort${on?' on':''}" data-tbl="${tbl}" data-sort="${k}" title="Trier par ${label.toLowerCase()}">${label}<i>${arrow}</i></button></th>`;
}
function setSort(tbl,k){
  const st=ui.sort[tbl];
  if(k==='default')delete ui.sort[tbl];
  else if(st&&st.k===k)ui.sort[tbl]={k,dir:st.dir==='asc'?'desc':'asc'};
  else ui.sort[tbl]={k,dir:DESC_FIRST.has(k)?'desc':'asc'};
  try{localStorage.setItem(SORT_KEY,JSON.stringify(ui.sort));}catch(e){}
  render();
}

function chart(){
  const h=s.weeks.slice(-18);if(!h.length)return '<p class="note">Jouez une journée pour voir les flux.</p>';
  const W=680,H=210,L=56,R=10,T=10,B=24,max=Math.max(...h.map(x=>Math.max(x.inc,x.exp)))*1.1||1,step=(W-L-R)/h.length,bw=Math.min(14,step*.34),y=v=>T+(H-T-B)*(1-v/max);
  let g='';for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line class="c-grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v>=1000?Math.round(v/1000)+'k':Math.round(v)}</text>`;}
  h.forEach((x,i)=>{const cx=L+step*i+step/2;g+=`<rect class="c-in" x="${cx-bw-1}" y="${y(x.inc)}" width="${bw}" height="${y(0)-y(x.inc)}" rx="2"><title>${x.w} recettes ${eur.format(x.inc)}</title></rect><rect class="c-out" x="${cx+1}" y="${y(x.exp)}" width="${bw}" height="${y(0)-y(x.exp)}" rx="2"><title>${x.w} dépenses ${eur.format(x.exp)}</title></rect>`;if(h.length<=18&&i%2===0)g+=`<text x="${cx}" y="${H-7}" text-anchor="middle">${x.w.split('J')[1]?'J'+x.w.split('J')[1]:''}</text>`;});
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:460px" role="img" aria-label="Recettes et dépenses par journée">${g}</svg></div>`;
}

  $('view').innerHTML=`

    <div class="kpi"><div class="lbl">Dernière affluence</div><div class="val">${s.lastAtt!=null?nf.format(s.lastAtt):'—'}</div><div class="hint">salle de ${nf.format(FAC.salle.levels[s.fac.salle])} places</div></div>
    <div class="kpi"><div class="lbl">Supporters</div><div class="val">${nf.format(s.fans)}</div><div class="hint">gagnent du monde à chaque victoire</div></div>
  </div>
  <div class="panel"><h2>Sponsor de la saison ${s.season}</h2>${s.sponsor?'':'<p class="pill warn" style="align-self:flex-start">À choisir avant la première journée</p>'}
    <div class="cards">${s.offers.map(offer).join('')}</div></div>
  <div class="cols">
    <div class="panel"><h2>Recettes et dépenses par journée</h2><div class="legend"><span><i style="background:var(--accent)"></i>Recettes</span><span><i style="background:var(--bar2)"></i>Dépenses</span></div>${chart()}</div>
    <div class="panel"><h2>Billetterie</h2>
      <div class="inline"><label for="ticket">Prix du billet</label><input class="field num" id="ticket" type="number" min="1" step="1" value="${s.ticket}"><span class="note">référence en ${DIVS[s.div]} : ${eur.format(ref)}</span></div>
      <p class="note" style="margin:0">Au-dessus du prix de référence, moins de supporters viennent. En dessous, la salle se remplit mieux mais chaque billet rapporte moins.</p>

function stadeCam(dt){
  const o=ST.orbit,g=ST.goal;
  if(g){const k=1-Math.exp(-dt*3.2);let d=g.th-o.th;d=Math.atan2(Math.sin(d),Math.cos(d));o.th+=d*k;o.ph+=(g.ph-o.ph)*k;o.rad+=(g.rad-o.rad)*k;o.t.lerp(g.t,k);
    if(Math.abs(d)<0.002&&Math.abs(g.rad-o.rad)<0.05&&o.t.distanceTo(g.t)<0.05)ST.goal=null;}
  const sp=Math.sin(o.ph);ST.cam.position.set(o.t.x+o.rad*sp*Math.sin(o.th),o.t.y+o.rad*Math.cos(o.ph),o.t.z+o.rad*sp*Math.cos(o.th));ST.cam.lookAt(o.t);
}
function stadeFocus(k,card){
  if(!ST||!ST.focus[k])return;
  const f=ST.focus[k];
  setInterior(!!f.inside);
  ST.goal={th:ST.orbit.th,ph:0.9,rad:f.r*(innerWidth/innerHeight<0.8?1.35:1),t:f.t.clone()};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){Object.assign(ST.orbit,{th:ST.goal.th,ph:ST.goal.ph,rad:ST.goal.rad});ST.orbit.t.copy(ST.goal.t);ST.goal=null;}
  document.querySelectorAll('.st-chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.focus===k)));
  showFacCard(CHIP2FAC(k));
}
function initStadeInput(){
  const cv=$('st-cv'),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  const pan=(dx,dy)=>{const o=ST.orbit,k=o.rad*0.0018,th=o.th;o.t.x+=-Math.cos(th)*dx*k-Math.sin(th)*dy*k;o.t.z+=Math.sin(th)*dx*k-Math.cos(th)*dy*k;o.t.x=cl(o.t.x,-160,160);o.t.z=cl(o.t.z,-160,160);};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ST.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ST.ptrs.size===2){ST.tap=null;const a=[...ST.ptrs.values()];ST.pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2};}
    else{ST.down={pan:e.button===2||e.shiftKey};ST.tap={t:performance.now(),moved:0};}});
  cv.addEventListener('pointermove',e=>{const p=ST.ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(ST.tap){ST.tap.moved+=Math.abs(dx)+Math.abs(dy);if(ST.tap.moved>6)ST.goal=null;}
    if(ST.ptrs.size===1&&ST.down){if(ST.tap&&ST.tap.moved<=6)return;if(ST.down.pan)pan(dx,dy);else{ST.orbit.th-=dx*0.006;ST.orbit.ph=cl(ST.orbit.ph-dy*0.005,0.2,1.42);}}
    else if(ST.ptrs.size===2&&ST.pinch){ST.goal=null;const a=[...ST.ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
      if(d>0)ST.orbit.rad=cl(ST.orbit.rad*ST.pinch.d/d,12,340);pan(mx-ST.pinch.mx,my-ST.pinch.my);ST.pinch={d,mx,my};}});
  const up=e=>{if(ST.tap&&ST.ptrs.size===1&&ST.tap.moved<=6&&performance.now()-ST.tap.t<500)stadePick(e.clientX,e.clientY);
    ST.tap=null;ST.ptrs.delete(e.pointerId);if(ST.ptrs.size<2)ST.pinch=null;if(!ST.ptrs.size)ST.down=null;else ST.down={pan:false};};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ST.tap=null;ST.ptrs.delete(e.pointerId);ST.pinch=null;ST.down=null;});
  cv.addEventListener('wheel',e=>{e.preventDefault();ST.goal=null;ST.orbit.rad=cl(ST.orbit.rad*(1+e.deltaY*0.0012),12,340);},{passive:false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
}
const FAC2CHIP=k=>k==='salle'?'tribunes':k, CHIP2FAC=k=>k==='tribunes'?'salle':k;
function stadePick(x,y){
  if(!ST||!ST.scene)return;const T=window.THREE;
  const r=$('st-cv').getBoundingClientRect(),ray=new T.Raycaster();
  ray.setFromCamera(new T.Vector2(((x-r.left)/r.width)*2-1,-((y-r.top)/r.height)*2+1),ST.cam);
  const vis=o=>{while(o){if(!o.visible)return false;o=o.parent;}return true;};
  for(const h of ray.intersectObjects(ST.scene.children,true)){
    if(!vis(h.object))continue;let o=h.object;while(o&&!o.userData.fac)o=o.parent;
    if(o){stadeFocus(FAC2CHIP(o.userData.fac),true);return;}
    if(h.object.isMesh&&h.distance<400)break;
  }
  hideFacCard();
}
function showFacCard(fk){
  const f=FAC[fk],l=s.fac[fk],max=f.cost.length-1,nc=f.cost[l+1],c=$('st-card');
  $('stc-t').textContent=fk==='salle'&&s.naming?s.naming.name:f.name;
  $('stc-l').textContent='Niveau '+(l+1)+' sur '+(max+1)+(f.upkeep[l]?', entretien '+eur.format(f.upkeep[l])+' par semaine':'');
  $('stc-now').textContent=l===0&&fk!=='salle'&&fk!=='parking'&&fk!=='ecran'?'Pas encore construit.':f.eff(l);
  const b=$('stc-up');
  if(l<max){$('stc-next').textContent='Niveau suivant : '+f.eff(l+1);b.hidden=false;b.dataset.k=fk;b.disabled=s.cash<nc;
    b.textContent=s.cash>=nc?(l===0&&fk!=='salle'&&fk!=='parking'&&fk!=='ecran'?'Construire':'Améliorer')+' pour '+eur.format(nc):'Il manque '+eur.format(nc-s.cash);}
  else{$('stc-next').textContent='Niveau maximum atteint.';b.hidden=true;}
  c.hidden=false;
}
function hideFacCard(){const c=$('st-card');if(c)c.hidden=true;document.querySelectorAll('.st-chip').forEach(b=>b.setAttribute('aria-pressed','false'));}
function stadeUpgrade(fk){
  const c=FAC[fk].cost[s.fac[fk]+1];if(c==null||s.cash<c)return;
  s.cash-=c;s.fac[fk]++;led(FAC[fk].name+' niveau '+(s.fac[fk]+1),-c);news(FAC[fk].name+' amélioré : '+FAC[fk].eff(s.fac[fk])+'.');save();render();
  const o={th:ST.orbit.th,ph:ST.orbit.ph,rad:ST.orbit.rad,t:ST.orbit.t.clone()};
  refreshStadeUI();buildStade();Object.assign(ST.orbit,{th:o.th,ph:o.ph,rad:o.rad});ST.orbit.t.copy(o.t);ST.goal=null;
  stadeFocus(FAC2CHIP(fk),true);toast(FAC[fk].name+' : niveau '+(s.fac[fk]+1)+' !');
}
document.addEventListener('click',e=>{const c=e.target.closest('.st-chip');if(c)return stadeFocus(c.dataset.focus,true);
  if(e.target.closest('#stc-up'))return stadeUpgrade(e.target.closest('#stc-up').dataset.k);
  if(e.target.closest('#stc-x'))return hideFacCard();
  if(e.target.closest('#st-close'))return closeStade();
  if(e.target.closest('#st-inside'))return setInterior(!ST.interior);
  if(e.target.closest('#st-night'))return setNight(!ST.night);
  if(e.target.closest('#st-home')&&ST&&ST.home){ST.goal={th:ST.home.th,ph:ST.home.ph,rad:ST.home.rad,t:ST.home.t.clone()};document.querySelectorAll('.st-chip').forEach(b=>b.setAttribute('aria-pressed','false'));}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('stade').hidden)closeStade();});

// ================= Codes =================
const CODES={
  HASHCASH:()=>{s.cash+=50000;led('Code HASHCASH',50000);return '+50 000 € en trésorerie';},
  MILLIONNAIRE:()=>{s.cash+=1000000;led('Code MILLIONNAIRE',1000000);return '+1 000 000 € en trésorerie';},
  STADEMAX:()=>{['salle','buvette','vip','ecran','parking','shop'].forEach(k=>s.fac[k]=FAC[k].cost.length-1);return 'toutes les infrastructures du stade au maximum';},
  STAFFMAX:()=>{s.fac.train=FAC.train.cost.length-1;s.fac.form=FAC.form.cost.length-1;s.coach=COACH.length-1;return 'entraînement, formation et entraîneur au maximum';},
  PEPITE:()=>{if(s.youth.length>=MAX_YOUTH){toast('Effectif Espoirs complet : libère une place avant.',true);return false;}
    const R={name:'Code PÉPITE',mu:Math.min(92,BASE[s.div]+22),sd:4,nats:{FR:6,SN:1,ML:1,CM:1,RS:1}};
    const y=makeProspect(R,5,'Tous','Code PÉPITE');y.age=17;y.sal=Math.round(y.sal*0.5);delete y.exp;delete y.fee;y.home=true;y.pot=Math.max(y.pot,Math.min(97,BASE[Math.min(6,s.div+2)]+10));
    s.youth.push(y);return y.fn+' '+y.ln+' (17 ans, '+y.pos+') rejoint les Espoirs';},
  SUPERSTAR:()=>{if(s.roster.length>=12){toast('Effectif complet (12 joueurs) : libère une place avant.',true);return false;}
    const p=genPlayer(Math.min(6,s.div+1),{age:ri(24,28),yrs:3,nat:'FR'});p.ovr=Math.max(p.ovr,BASE[Math.min(6,s.div+1)]+4);p.pot=Math.max(p.pot,p.ovr);p.sal=salaryFor(p.ovr);
    assignNum(p);s.roster.push(p);return p.fn+' '+p.ln+' ('+p.pos+', '+p.ovr+') signe sans indemnité';},
  INFIRMERIE:()=>{const n=s.roster.filter(p=>p.inj).length;s.roster.forEach(p=>p.inj=0);return n?n+' joueur'+(n>1?'s':'')+' guéri'+(n>1?'s':''):'aucun blessé, l’infirmerie est vide';},
  FANZONE:()=>{s.fans*=2;return 'supporters doublés ('+nf.format(s.fans)+')';},
  MECENE:()=>{s.mecene=s.season;return 'un mécène paie les salaires des joueurs jusqu’à la fin de la saison';},
  MONTEE:()=>{if(s.div>=6){toast('Le club est déjà en '+DIVS[6]+'.',true);return false;}
    s.div++;s.best=Math.max(s.best,s.div);s.fans=Math.round(s.fans*1.4);s.week=0;s.sponsor=null;s.ticket=REF_PRICE[s.div];
    newLeague();genMarket();genOffers();setObjective();
    return 'montée directe en '+DIVS[s.div]+' : la saison redémarre, choisis un nouveau sponsor';}
};
function applyCode(raw){
  const c=String(raw||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'');
  if(!c)return toast('Entre un code.',true);
  const f=CODES[c];if(!f)return toast('Code inconnu : '+c,true);
  const msg=f();if(msg===false)return;
  if(!Array.isArray(s.cheats))s.cheats=[];s.cheats.push({code:c,season:s.season,week:Math.min(s.week+1,WEEKS)});
  news('Code '+c+' : '+msg+'.');save();render();toast('Code '+c+' activé : '+msg);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='code-in'){e.preventDefault();applyCode(e.target.value);}});
