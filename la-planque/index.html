<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Planque</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : jeu plein écran ; lieu en haut à gauche, consigne au centre en bas, touches en bas à gauche, vitesse en bas à droite. Univers unique de nuit. */
:root{--ink:#030406;--glass:rgba(9,11,16,.7);--line:rgba(150,220,255,.18);--acc:#27e7ff;--text:#eef6ff;--muted:#8c9bb0;
  --display:"Michroma","Eurostile","Arial Black",sans-serif;--ui:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--text);font-family:var(--ui);-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0}#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.place{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;pointer-events:none}
.place small{font-size:10px;letter-spacing:.4em;color:var(--acc);font-weight:600;text-transform:uppercase}
.place b{font-family:var(--display);font-weight:400;font-size:clamp(16px,2.4vw,24px);letter-spacing:.16em}
#prompt{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);border-radius:4px;padding:10px 18px;font-size:15px;font-weight:600;letter-spacing:.04em;white-space:nowrap;pointer-events:none;backdrop-filter:blur(6px)}
#prompt kbd,.keys kbd{font-family:var(--ui);font-weight:700;font-size:.8em;padding:.06em .45em;border:1px solid rgba(150,220,255,.4);border-bottom-width:2px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--text)}
.keys{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);max-width:calc(100% - 200px)}
.keys span{display:flex;gap:6px;align-items:center}
#speed{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:right;pointer-events:none}
#speed b{display:block;font-family:var(--display);font-weight:400;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
#speed small{font-size:11px;letter-spacing:.3em;color:var(--muted)}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-size:15px;letter-spacing:.3em;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 0 16px var(--acc);white-space:nowrap}
#toast.show{opacity:1}
#touch{position:absolute;inset:auto 0 0 0;height:0}
#touch button{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;background:rgba(10,12,18,.6);border:1px solid var(--line);color:var(--text);font:700 13px var(--ui);touch-action:none}
#touch button.on{background:rgba(39,231,255,.3)}
.touch .keys{display:none}.touch #speed{bottom:auto;top:calc(18px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="stage"></div>
<div class="place"><small id="placeTop">Néon City</small><b id="placeName">Extérieur</b></div>
<div id="prompt" hidden></div>
<div id="toast"></div>
<div id="speed" hidden><b id="spd">0</b><small>KM/H</small></div>
<div class="keys" aria-label="Commandes">
  <span><kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> Avancer, tourner</span>
  <span><kbd>Shift</kbd> Courir / boost</span>
  <span><kbd>Espace</kbd> Sauter / frein à main</span>
  <span><kbd>E</kbd> Monter / descendre</span>
</div>
<div id="touch" hidden>
  <button type="button" data-k="left" style="left:calc(16px + env(safe-area-inset-left,0px))">◀</button>
  <button type="button" data-k="right" style="left:calc(92px + env(safe-area-inset-left,0px))">▶</button>
  <button type="button" data-k="use" style="left:calc(54px + env(safe-area-inset-left,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px))">E</button>
  <button type="button" data-k="up" style="right:calc(16px + env(safe-area-inset-right,0px));width:78px;height:78px">GAZ</button>
  <button type="button" data-k="down" style="right:calc(104px + env(safe-area-inset-right,0px))">FREIN</button>
  <button type="button" data-k="hb" style="right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px))">SAUT</button>
  <button type="button" data-k="nitro" style="right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(106px + env(safe-area-inset-bottom,0px))">BOOST</button>
</div>

function updateCape(t,dt){if(!CH)return;const g=CH.capeGeo,p=g.attributes.position,W=CH.cW,Hs=CH.cH,L=1.38;

    const width=.4+v*.78+drop*v*.25;let x=u*width;
    let y=.52-v*L*(1-lift*.35*v);
    let z=-.12-.11*(1-(2*u)*(2*u))*(1-v*.6)-v*(.06+lag*.55*v)-drop*v*v*.35+lift*v*v*.5;
    const w=Math.sin(t*2.1+v*5.2+u*2.4)*.045*v+Math.sin(t*3.3+v*9-u*5)*.018*v;z+=w;x+=Math.sin(t*1.6+v*3.5)*.02*v*(u<0?-1:1);
    y+=Math.sin(t*2.4+u*6)*.012*v;
    p.setXYZ(idx,x,y,z);}}
  p.needsUpdate=true;g.computeVertexNormals();}

const ST={maxV:62,accel:17,grip:6.6,steer:2.45,drift:.9};
function carStep(dt,drive){const fx=Math.sin(C.h),fz=Math.cos(C.h),rx=Math.cos(C.h),rz=-Math.sin(C.h);let vF=C.vx*fx+C.vz*fz,vR=C.vx*rx+C.vz*rz;

function onLift(e){return inR(e.x,e.z,SH,-.4)&&Math.abs(e.y-ELEV.y)<.2;}

  else{const here=ELEV.y>-1?0:BASE.y;
    if(onLift(P)&&mover<.5){ELEV.still+=dt;if(ELEV.still>1.2){ELEV.still=0;start(here===0?BASE.y:0);}}else ELEV.still=0;
    // appel : on s'approche du puits au niveau où la plateforme n'est pas
    const lvl=P.y>-1?0:BASE.y;if(lvl!==here&&inR(P.x,P.z,SH,4)&&!inR(P.x,P.z,SH,-.2))start(lvl);}

  // ce qui est posé sur la plateforme suit
  [F,C].forEach(e=>{if(inR(e.x,e.z,SH,-.05)&&Math.abs(e.y-ELEV.prev)<.35&&e.vy===0)e.y=ELEV.y;});ELEV.prev=ELEV.y;}

addEventListener('keyup',e=>{if(MAP[e.code])K[MAP[e.code]]=false;});addEventListener('blur',()=>{for(const k in K)K[k]=false;});
if(window.matchMedia&&matchMedia('(pointer:coarse)').matches){document.body.classList.add('touch');$('touch').hidden=false;
  document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();if(k==='use'){interact();return;}if(k==='hb'&&MODE==='foot'&&F.vy===0&&F.down<=0)F.vy=8.4;K[k]=true;b.classList.add('on');},off=e=>{e.preventDefault();K[k]=false;b.classList.remove('on');};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);});}

/* ---------- HUD ---------- */
function hud(){const P=MODE==='car'?C:F;let top='Néon City',name='Extérieur';
  if(P.y<-1){top='Néon City · Niveau -1';name='La base';}else if(P.y<-.1&&inR(P.x,P.z,SH)){top='Monte-charge';name='Puits';}else if(inR(P.x,P.z,BLD)){top='Stockage Duval & Fils';name='Entrepôt';}
  $('placeTop').textContent=top;$('placeName').textContent=name;
  let p='';if(MODE==='foot'&&nearCar())p='<kbd>E</kbd> Monter dans la supercar';else if(onLift(P)&&!ELEV.moving)p='Reste immobile pour '+(ELEV.y>-1?'descendre':'monter');else if(ELEV.moving)p=ELEV.to<0?'Descente…':'Montée…';
  else if(MODE==='car'&&C.speed<6&&!onLift(C))p='<kbd>E</kbd> Descendre';else if(MODE==='foot'&&P.z>3&&P.y>-1&&!inR(P.x,P.z,BLD))p='Entre dans l\'entrepôt';
  const pr=$('prompt');if(p){if(pr.innerHTML!==p)pr.innerHTML=p;pr.hidden=false;}else pr.hidden=true;
  $('speed').hidden=MODE!=='car';$('spd').textContent=Math.round(C.speed*3.6);}

/* ================= Boucle ================= */
const clock=new T.Clock();let scrT=0,hudT=0;
function frame(){requestAnimationFrame(frame);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  for(let k=0;k<2;k++){if(MODE==='foot')footStep(dt/2);carStep(dt/2,MODE==='car');}
  updLift(dt);
  updDoor(dt);const P=MODE==='car'?C:F;
  if(MODE==='foot')drawFoot(dt);drawCar(dt);
  // caméra de poursuite, abaissée sous les plafonds
  const fx=Math.sin(P.h),fz=Math.cos(P.h),car=MODE==='car',dist=car?7+C.speed*.04:4.4,hh=car?2.6:2.1,ceil=ceilAt(P.x,P.z,P.y);
  const tp=new T.Vector3(P.x-fx*dist,Math.min(P.y+hh,ceil-.5),P.z-fz*dist);camPos.lerp(tp,1-Math.exp(-dt*(car?6:8)));camPos.y=Math.min(camPos.y,Math.max(ceilAt(camPos.x,camPos.z,P.y),P.y+1)-.4);
  camLook.set(P.x+fx*(car?4:2),P.y+(car?1:1.3),P.z+fz*(car?4:2));camera.position.copy(camPos);if(shake>0){camera.position.x+=(Math.random()-.5)*shake*.4;camera.position.y+=(Math.random()-.5)*shake*.3;shake=Math.max(0,shake-dt*2.5);}
  camera.lookAt(camLook);const tf=car?62+C.speed*.25+(C.boost?8:0):60;camera.fov+=(tf-camera.fov)*Math.min(1,dt*4);camera.updateProjectionMatrix();
  if(window.__holo)window.__holo.rotation.y+=dt*.25;
  scrT+=dt;if(scrT>.1){scrT=0;window.__screens.forEach(s=>{s.draw(s.g,s.c.width,s.c.height,t);s.tex.needsUpdate=true;});}
  hudT+=dt;if(hudT>.1){hudT=0;hud();}
  composer.render();}
camera.position.copy(camPos);frame();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
})();
</script>
